<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="A first visit to Ellie, on the real screens of an agency account.">
<title>Ellie, a first visit</title>
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/logo/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/logo/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Mulish:wght@400;500;600&display=swap">
<style>
/* Ellie, a first visit. A guided tour over the real screens of the application (agency account, fictional event in
   Bangkok, captured on 17/11/2026 from the application's main branch). Same charter and shell as the demo.
   Desktop: the story on the left, the screen on the right, a gold frame on what to look at, no scrolling.
   Phone: title, text, the phone capture of the same screen; navigation fixed at the bottom. */
:root {
  --bg: #051022; --panel: #0b2447; --raised: #13305a;
  --text: #f7f3ea; --muted: #c2bcaf; --gold: #d8b873; --ink: #0b1a33; --line: #2a4470; --ctl: #8f897c;
  --f-title: "Cormorant Garamond", "Cormorant", Georgia, serif;
  --f-text: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s: .875rem; --b: 1rem; --l: 1.125rem; --h3: 1.375rem; --h1: 2.5rem; --h0: 3.5rem;
}
* { box-sizing: border-box; }
html { font-size: clamp(16px, min(1.15vw, 2vh), 28px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--b)/1.5 var(--f-text); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#bg { position: fixed; inset: 0; z-index: -1; background: var(--bg) center / cover no-repeat; opacity: 0; transition: opacity .6s ease; }
#bg.on { opacity: .2; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.4rem 4rem 0; }
.brand { display: inline-flex; color: var(--gold); padding: .4rem 0; }
.brand svg { height: 1rem; width: auto; display: block; }
.sign { font-size: var(--s); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

.eyebrow { margin: 0; font-size: var(--s); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font: 400 var(--h1)/1.1 var(--f-title); letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: italic; color: var(--gold); }
.lede { margin: 0; font-size: var(--l); color: var(--muted); max-width: 32rem; text-wrap: pretty; }
.where { margin: 0; display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: center; font-size: var(--s); color: var(--muted); }
.where b { font-weight: 500; color: var(--text); }
.tag { display: inline-flex; align-items: center; gap: .5rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text); }
.tag::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--gold); }

main { min-height: 0; padding: 0 4rem; }
.split { height: 100%; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 3.5rem; align-items: center; }
.story { display: grid; gap: 1.3rem; align-content: center; }
.screen { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
/* The capture keeps its 16:10 ratio and never grows past the space between the header and the navigation. */
.frame { position: relative; width: min(100%, calc((100dvh - 10.5rem) * 1.6)); aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.zoom { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .45s ease; }
.frame img { width: 100%; height: 100%; object-fit: cover; }
.frame .m { display: none; }
.spot { position: absolute; border: 1.5px solid var(--gold); border-radius: 6px; box-shadow: 0 0 0 200vmax rgba(5, 16, 34, .42); pointer-events: none; transition: all .35s ease; }

.cover { height: 100%; display: grid; align-content: center; justify-items: start; gap: 1.6rem; max-width: 60rem; }
.cover h1 { font-size: var(--h0); }
.stops { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 2rem; width: 100%; counter-reset: s; }
.stops li { counter-increment: s; border-top: 1px solid var(--line); }
.stops button { width: 100%; min-height: 2.75rem; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); align-items: center; text-align: left; padding: .45rem 0; color: var(--text); }
.stops button::before { content: counter(s, decimal-leading-zero); font: 400 var(--b)/1 var(--f-title); color: var(--gold); }
.stops button:hover span { text-decoration: underline; text-underline-offset: 3px; }
.note { margin: 0; font-size: var(--s); color: var(--muted); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 4rem 1.4rem; }
.count { font-size: var(--s); color: var(--muted); letter-spacing: .08em; }
.count b { color: var(--text); font-weight: 600; }
.navb { display: flex; gap: .75rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0 1.5rem; border: 1px solid var(--ctl); border-radius: 4px; font-weight: 500; color: var(--text); transition: border-color .2s, background .2s; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: #e3c98f; }
.btn[disabled] { visibility: hidden; }

.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (min-width: 900px) {
  html, body { height: 100%; overflow: hidden; }
  body { height: 100dvh; }
}
@media (min-width: 900px) and (max-width: 1300px) {
  .top, .nav { padding-left: 3rem; padding-right: 3rem; } main { padding: 0 3rem; }
  .split { gap: 2.5rem; }
}
@media (min-width: 900px) and (max-height: 720px) {
  :root { --h1: 2.2rem; --h0: 3rem; }
  .top { padding-top: 1rem; } .nav { padding-top: .7rem; padding-bottom: 1rem; }
  .story { gap: 1rem; }
}

@media (max-width: 899px) {
  :root { --h1: 2rem; --h0: 2.3rem; }
  .top { padding: 1rem 1.25rem 0; } .sign { display: none; }
  main { padding: 1.25rem 1.25rem 6.5rem; }
  .split { display: block; height: auto; }
  .story { gap: .9rem; margin-bottom: 1.4rem; }
  .screen { height: auto; display: block; }
  .frame { width: 100%; max-width: 24rem; margin: 0 auto; aspect-ratio: 390 / 844; border-radius: 1.6rem; border-width: .4rem; border-color: #1b2940; }
  .frame .d { display: none; } .frame .m { display: block; }
  .cover { height: auto; gap: 1.2rem; padding-top: 1rem; }
  .stops { grid-template-columns: 1fr; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; padding: .7rem 1.25rem calc(.7rem + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn { padding: 0 1.2rem; }
}
@media (max-width: 420px) { .count span { display: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .spot, .zoom, #bg { transition: none; } }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<header class="top">
  <button class="brand" id="home" title="Back to the start" aria-label="Ellie, back to the start"><svg viewBox="0 0 1013 146" fill="currentColor" aria-hidden="true" focusable="false"><rect x="0" y="0" width="130.5" height="12.5"/><rect x="0" y="0" width="12.5" height="60"/><path d="M114.5 66H30A30 30 0 0 0 0 96V146H12.5V96A17.5 17.5 0 0 1 30 78.5H114.5Z"/><rect x="0" y="133.5" width="130.5" height="12.5"/><rect x="267" y="0" width="12.5" height="146"/><rect x="267" y="133.5" width="92.5" height="12.5"/><rect x="499" y="0" width="12.5" height="146"/><rect x="499" y="133.5" width="92" height="12.5"/><rect x="737.5" y="0" width="12.5" height="146"/><rect x="905" y="0" width="12.5" height="146"/><rect x="905" y="0" width="107.5" height="12.5"/><rect x="905" y="66" width="96.5" height="12.5"/><rect x="905" y="133.5" width="107.5" height="12.5"/></svg></button>
  <span class="sign">Orchestrate the invisible</span>
</header>
<main id="app"></main>
<footer class="nav">
  <span class="count" id="count"></span>
  <span class="navb"><button class="btn" id="prev">Back</button><button class="btn primary" id="next">Next</button></span>
</footer>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var DMC = "";
  try { DMC = (new URLSearchParams(location.search).get("dmc") || "").trim().slice(0, 40); } catch (e) {}

  // Where to look on each capture, as fractions of the screen (measured on the live page when it was captured).
  var R = {
    events: { d: [.18, .385, .81, .072], m: [.08, .42, .8, .05] },
    event: { d: [.18, .218, .51, .36], m: [.04, .424, .88, .184] },
    compose: { d: [.18, .404, .78, .164], m: [.08, .483, .8, .045] },
    guests: { d: [.18, .438, .81, .1], m: [.08, .482, .8, .034] },
    guest: { d: [.556, .51, .423, .099], m: [.048, .506, .866, .105] },
    maison: { d: [.55, .066, .21, .058], m: null },
    day: { d: [.19, .33, .758, .044], m: [.08, .388, .8, .093] },
    board: { d: [.181, .42, .184, .12], m: [.08, .388, .8, .093] },
    fleet: { d: [.18, .426, .78, .192], m: [.09, .484, .78, .03] },
    car: { d: [.432, .458, .238, .031], m: [.08, .51, .8, .05] },
    tasks: { d: [.18, .394, .748, .049], m: [.04, .477, .883, .073] }
  };

  var STEPS = [
    { id: "events", where: "Events", name: "Your events",
      title: "Every event you run, on <em>one</em> page.",
      lede: "Its phase, its dates and how ready it is. An event starts from the brief the maison sends." },
    { id: "event", where: "Event", name: "The event",
      title: "Six modules make <em>one</em> event.",
      lede: "Venue, dining, activities, transport, accommodation and services. Each fills up as its elements are proposed, approved and confirmed." },
    { id: "compose", where: "Event · Compose the event", name: "Compose",
      title: "You propose. The maison <em>approves</em>.",
      lede: "Each restaurant, visit or car is proposed by your team and stays marked Awaiting the maison until it is approved." },
    { id: "guests", where: "Guest management", name: "Guests",
      title: "Your team sees codes, <em>never</em> names.",
      lede: "AE-0001 is the main guest of a party of four. The names are held by the maison, and every guest arrives from its own client file." },
    { id: "guest", where: "Guest management · a guest", name: "One guest",
      title: "One guest, <em>one</em> page.",
      lede: "Tier, party, client advisor, hotel, and every request to execute to the letter: white flowers, no lilies." },
    { id: "maison", where: "The maison's side", name: "The maison's view",
      title: "The maison sees her <em>name</em>.",
      lede: "The same page, opened by the maison's client experience team. Your agency works on the same file without ever holding the name." },
    { id: "day", where: "Orchestration · Day 1", name: "The day",
      title: "Each day opens on what needs <em>attention</em>.",
      lede: "One blocked, three critical dietary notes, eight VVIP arrivals, three without a meet and greet. Then every guest, with the next step." },
    { id: "board", where: "Orchestration · Kanban", name: "Blocked first",
      title: "What is blocked comes <em>first</em>.",
      lede: "AE-0001's transfer from the airport is blocked, with its reason: a party of four and no car large enough yet." },
    { id: "fleet", where: "Orchestration · Transportation · Fleet", name: "The fleet",
      title: "Who is free at <em>16:00</em>?",
      lede: "Type a time. Ellie shows the cars that are free and the ones that are busy, with each driver's hours on duty." },
    { id: "car", where: "Orchestration · a car", name: "One car",
      title: "One car's day, and its <em>conflicts</em>.",
      lede: "Ellie warns when two transfers overlap on the same car, and lists the transfers still without one. It warns, it never blocks." },
    { id: "tasks", where: "Orchestration · To do", name: "To do",
      title: "The day's to-do, hour by <em>hour</em>.",
      lede: "Meet and greet, the driver's brief, the signage: drawn from every guest's journey, to tick off on the ground." }
  ];
  var BG = { events: "agency-desk", event: "maison-viewing", compose: "dinner-table", guests: "discretion-folder", guest: "discretion-folder", maison: "maison-viewing", day: "arrival-cars", board: "arrival-cars", fleet: "hero-car", car: "hero-car", tasks: "river-night" };
  var S = { i: 0 };
  var N = STEPS.length + 1;

  function spot(r) {
    if (!r) return "";
    var x = Math.max(0, r[0] - .006), y = Math.max(0, r[1] - .008), w = Math.min(1 - x, r[2] + .012), h = Math.min(1 - y, r[3] + .016);
    return '<span class="spot" style="left:' + (x * 100).toFixed(2) + '%;top:' + (y * 100).toFixed(2) + '%;width:' + (w * 100).toFixed(2) + '%;height:' + (h * 100).toFixed(2) + '%"></span>';
  }
  function small() { try { return window.matchMedia("(max-width: 899px)").matches; } catch (e) { return false; } }

  function render() {
    var app = $("#app"), bg = $("#bg");
    if (S.i === 0) {
      app.innerHTML = '<div class="cover fade">' +
        '<p class="eyebrow">' + (DMC ? "Prepared for " + esc(DMC) : "A first visit") + '</p>' +
        '<h1>Your first visit to <em>Ellie</em>.</h1>' +
        '<p class="lede">The real screens of an agency account, on a fictional event: three days of high jewellery in Bangkok, eighteen guests, six cars.</p>' +
        '<ol class="stops">' + STEPS.map(function (s, k) { return '<li><button data-go="' + (k + 1) + '"><span>' + s.name + '</span></button></li>'; }).join("") + '</ol>' +
        '<p class="note">Every screen is in Ellie today. Guests, hotels and cars are fictional.</p>' +
      '</div>';
      bg.style.backgroundImage = 'url("../assets/img/agency-desk-' + (small() ? 800 : 1264) + '.webp")';
      bg.className = "on";
    } else {
      var s = STEPS[S.i - 1], r = R[s.id];
      app.innerHTML = '<div class="split"><section class="story fade">' +
          '<p class="eyebrow">' + s.where + '</p>' +
          '<h1>' + s.title + '</h1>' +
          '<p class="lede">' + s.lede + '</p>' +
          '<p class="where"><span class="tag">In Ellie today</span></p>' +
        '</section><section class="screen">' +
          '<div class="frame"><div class="zoom">' +
            '<img class="d" src="shots/' + s.id + '-d.webp" width="1920" height="1200" alt="The ' + s.name.toLowerCase() + ' screen in Ellie, on a desktop">' +
            '<img class="m" src="shots/' + s.id + '-m.webp" width="780" height="1688" alt="The ' + s.name.toLowerCase() + ' screen in Ellie, on a phone">' +
            '<span class="d-spot">' + spot(small() ? r.m : r.d) + '</span>' +
          '</div></div></section></div>';
      // On a desktop the capture is enlarged around what to look at, so its text stays readable.
      var z = app.querySelector(".zoom");
      if (!small() && r.d) {
        var k = Math.max(1.4, Math.min(1.7, .82 / r.d[2])), cx = r.d[0] + r.d[2] / 2, cy = r.d[1] + r.d[3] / 2;
        var tx = Math.min(0, Math.max(1 - k, r.d[2] * k > .96 ? .02 - r.d[0] * k : .5 - cx * k)), ty = Math.min(0, Math.max(1 - k, .5 - cy * k));
        z.style.transform = "translate(" + (tx * 100).toFixed(2) + "%, " + (ty * 100).toFixed(2) + "%) scale(" + k.toFixed(3) + ")";
      }
      bg.className = "";
      bg.style.backgroundImage = 'url("../assets/img/' + BG[s.id] + '-800.webp")';
      if (S.i < STEPS.length) { var pre = new Image(); pre.src = "shots/" + STEPS[S.i].id + (small() ? "-m" : "-d") + ".webp"; }
    }
    $("#count").innerHTML = S.i === 0 ? "A first visit" : '<b>' + S.i + '</b> / ' + STEPS.length + '<span> &nbsp; ' + STEPS[S.i - 1].name + '</span>';
    $("#prev").disabled = S.i === 0;
    $("#next").textContent = S.i === 0 ? "Start" : S.i === N - 1 ? "Start again" : "Next";
    document.title = S.i === 0 ? "Ellie, a first visit" : "Ellie, a first visit: " + STEPS[S.i - 1].name.toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { go(+b.getAttribute("data-go")); }; });
  }
  function go(i) {
    S.i = (i + N) % N;
    var id = S.i === 0 ? "" : STEPS[S.i - 1].id;
    history.replaceState(null, "", location.pathname + location.search + (id ? "#" + id : ""));
    render(); window.scrollTo(0, 0);
  }
  function fromHash() {
    var id = (location.hash || "").replace("#", ""), k = 0;
    STEPS.forEach(function (s, j) { if (s.id === id) k = j + 1; });
    S.i = k; render();
  }
  $("#prev").onclick = function () { go(S.i - 1); };
  $("#next").onclick = function () { go(S.i + 1); };
  $("#home").onclick = function () { go(0); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") { if (S.i < N - 1) go(S.i + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { if (S.i > 0) go(S.i - 1); }
    else if (e.key === "Home") go(0);
  });
  var mq; try { mq = window.matchMedia("(max-width: 899px)"); if (mq.addEventListener) mq.addEventListener("change", render); } catch (e) {}
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
