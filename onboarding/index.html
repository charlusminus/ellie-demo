<style>
/* Layout: a clickable Ellie agency account (header, sidebar, views) with a spotlight tour on top, like a product demo. */
:root {
  --ink: #0b1426;
  --panel: #12203a;
  --panel-2: #172a4a;
  --panel-3: #1d3358;
  --line: #24365a;
  --text: #ece7dc;
  --muted: #a6adbd;
  --gold: #d3b77c;
  --gold-ink: #1a1408;
  --ok: #7cc39a;
  --warn: #e3b25c;
  --crit: #e07a6e;
  --soon: #9fb3e6;
  --shade: rgba(4, 8, 18, .72);
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--body); font-size: 14.5px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input, select { font: inherit; color: var(--text); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }

/* header */
.hdr { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
.hl { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .3em; font-weight: 600; }

.evt i { font-family: var(--display); color: var(--gold); font-size: 18px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--text); }
.iconbtn { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.iconbtn .dot { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--crit); font-size: 10px; display: grid; place-items: center; padding: 0 3px; color: #fff; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-weight: 600; display: grid; place-items: center; font-size: 12.5px; }

/* sidebar */
.side { border-right: 1px solid var(--line); padding: 14px 10px; display: grid; gap: 4px; align-content: start; background: var(--panel); }
.side button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 9px 12px; border-radius: 8px; color: var(--muted); }
.side button[aria-current="page"] { background: var(--panel-3); color: var(--text); }
.side .sec { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 12px 4px; }
.soon-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--soon); flex: 0 0 auto; }
@media (max-width: 860px) {
  .side { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
  .side .sec { display: none; }
}

/* main */
.main { padding: 22px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; align-content: start; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 3.4vw, 38px); line-height: 1.08; }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 64ch; }
.label { text-transform: uppercase; letter-spacing: .12em; font-size: 10.5px; color: var(--muted); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; flex-wrap: wrap; }

.row .l { display: grid; gap: 2px; min-width: 0; }
.row .t { font-weight: 500; }
.s { color: var(--muted); font-size: 12.5px; }
.code { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 600; letter-spacing: .02em; }
.pill { font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); } .pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.crit { color: var(--crit); border-color: var(--crit); } .pill.soon { color: var(--soon); border-color: var(--soon); }
.btn { border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: transparent; font-size: 13.5px; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: rgba(211,183,124,.12); }
.chip .c { color: var(--gold); margin-left: 6px; font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }

tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; }
.days { display: flex; gap: 6px; overflow-x: auto; }
.day { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; position: relative; }
.day[aria-pressed="true"] { border-color: var(--gold); }
.day .rd { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); }
.kan { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
.kcol { display: grid; gap: 8px; align-content: start; min-width: 170px; }
.kcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 2px; cursor: pointer; }
.kcard:hover { border-color: var(--gold); }
.kcard.blocked { border-left: 3px solid var(--crit); }
.progress { height: 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .5s ease; }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.banner.ok { border-color: var(--ok); color: var(--ok); } .banner.soon { border-color: var(--soon); color: var(--soon); }
.why { border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; color: var(--muted); max-width: 70ch; }
.why b { color: var(--gold); font-weight: 600; }
.timeIn { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.timeIn input, .field { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.timeIn input { width: 100px; font-variant-numeric: tabular-nums; }
.field { width: 100%; }
.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mod { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; display: grid; gap: 4px; background: var(--panel-2); }
.mod[aria-pressed="true"] { border-color: var(--gold); }
.phone { width: min(320px, 100%); border: 1px solid var(--line); border-radius: 26px; padding: 14px; background: var(--ink); display: grid; gap: 10px; margin: 0 auto; }
.bub { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font-size: 13px; }
.bub.me { background: rgba(211,183,124,.14); border-color: var(--gold); justify-self: end; }
.bub .w { font-size: 10.5px; color: var(--muted); display: block; }
.bars { display: grid; gap: 8px; }
.bl { display: grid; grid-template-columns: 120px minmax(0,1fr) 70px; gap: 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.bl .tr { height: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bl .f { display: block; height: 100%; background: var(--gold); }
.bl .v { text-align: right; color: var(--muted); }

.scrim { position: fixed; inset: 0; background: var(--shade); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 41; overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 40px 18px; display: grid; gap: 14px; align-content: start; }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.pop { position: fixed; z-index: 35; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(360px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.4); }
.pop button.mi { text-align: left; padding: 8px 10px; border-radius: 8px; }
.pop button.mi:hover, .pop a.mi:hover { background: var(--panel-2); }
.pop a.mi { display: block; text-align: left; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: inherit; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 10px; }
.sw { width: 38px; height: 22px; border-radius: 999px; background: var(--panel-3); border: 1px solid var(--line); position: relative; flex: 0 0 auto; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .2s; }

.ask { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); max-height: min(560px, calc(100% - 140px)); z-index: 36; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.45); }

.msg { border-radius: 10px; padding: 9px 11px; font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); }
.msg.me { background: rgba(211,183,124,.14); border-color: var(--gold); justify-self: end; max-width: 85%; }
.msg ul { margin: 6px 0 0; padding-left: 18px; }
.card { border: 1px solid var(--gold); border-radius: 10px; padding: 10px; display: grid; gap: 6px; font-size: 13px; }

/* tour */
.tour-hole { position: fixed; z-index: 50; border-radius: 10px; box-shadow: 0 0 0 9999px var(--shade); outline: 2px solid var(--gold); pointer-events: none; transition: all .25s ease; }

@media (prefers-reduced-motion: reduce) { .tour-hole, .progress i, .sw::after { transition: none; } }

    { view: "compose", target: "#mods", title: "Built with the maison", body: "Each component is proposed by the agency and approved by the maison, module by module. Fewer calls, fewer versions." },
    { view: "costs", target: ".main .cols", title: "Paid sooner", body: "In co-design. Advances land on a guest, a market and a service line as they happen. The recharge is ready at close-out, not weeks later." },
    { view: "team", target: "#driverPhone", title: "Looked after on the ground", body: "In co-design. Drivers get their ride, not a manual. If a status is missing, Ellie asks, then calls in their language, then tells the event lead. At night, it thanks them." },
    { view: "protocols", target: "#rollcall", title: "Never alone with a problem", body: "In co-design. A flight is late: one person runs the protocol, everyone is told what changes for them, and the board shows who confirmed." },
    { view: "home", target: ".fab", title: "Ask Ellie", body: "For the moments a screen is too slow: ask in plain words, Ellie answers from the event and prepares the change. A person always confirms." },
    { view: "home", target: "#avatarBtn", title: "Build it with us", body: "Open the menu for the design partner proposal, and to switch the In co-design features on or off while you present." }
  ];

  // ------------------------------------------------------------ render
  function render() {
    var notifCount = 3;
    var html = '<div class="app">' +
      '<header class="hdr"><div class="hl"><span class="brand">ELLIE</span><span class="evt"><b>Maison Aurore</b><i>Private Viewing Bangkok</i><span class="live">LIVE · DAY 1</span></span></div>' +
        '<div class="hr"><div class="seg" role="group" aria-label="View as" id="viewAs">' + [["agency", "Agency"], ["maison", "Maison"]].map(function (v) { return '<button data-as="' + v[0] + '" aria-pressed="' + (S.as === v[0]) + '">' + v[1] + '</button>'; }).join("") + '</div>' +
        '<button class="iconbtn" id="bellBtn" aria-label="Notifications">🔔<span class="dot">' + notifCount + '</span></button>' +
        '<button class="avatar" id="avatarBtn" aria-label="Menu">NK</button></div></header>' +
      '<nav class="side" aria-label="Sections"><div class="sec">Event</div>' + NAV.filter(function (n) { return S.codesign || !n.soon; }).map(function (n) { return '<button data-view="' + n.id + '"' + (S.view === n.id ? ' aria-current="page"' : "") + '><span>' + n.label + '</span>' + (n.soon ? '<span class="soon-dot" aria-label="in co-design"></span>' : "") + '</button>'; }).join("") + '</nav>' +
      '<main class="main" id="main">' + ({ home: vHome, guests: vGuests, tower: vTower, fleet: vFleet, compose: vCompose, costs: vCosts, team: vTeam, protocols: vProtocols }[S.view])() +
        '<p class="s" style="text-align:center">Demo with fictional guests, hotels and costs. Features marked In co-design are proposals to shape with the agency.</p></main>' +
      '</div>' +
      '<button class="fab" id="fab" aria-label="Ask Ellie">✦</button>' +
      (S.askOpen ? oAsk() : "") + (S.notifOpen ? oNotif() : "") + (S.menuOpen ? oMenu() : "") +
      (S.guest ? oGuest() : "") + (S.importOpen ? oImport() : "") + (S.partnerOpen ? oPartner() : "") +
      (S.tour >= 0 ? '<div class="tour-hole" id="tourHole"></div><div class="tour-card" id="tourCard" role="dialog" aria-label="Tour"><span class="n">Step ' + (S.tour + 1) + ' of ' + TOUR.length + '</span><h3>' + TOUR[S.tour].title + '</h3><p>' + TOUR[S.tour].body + '</p><div class="act"><button class="btn sm" id="tourSkip">Skip</button><span style="display:flex;gap:8px">' + (S.tour > 0 ? '<button class="btn sm" id="tourBack">Back</button>' : "") + '<button class="btn sm primary" id="tourNext">' + (S.tour === TOUR.length - 1 ? "Got it" : "Next") + '</button></span></div></div>' : "");
    $("#app").innerHTML = html;
    wire();
    if (S.tour >= 0) requestAnimationFrame(placeTour);
  }

  function set(p) { for (var k in p) S[k] = p[k]; render(); }
  function wire() {
    $$("[data-view]").forEach(function (b) { b.onclick = function () { set({ view: b.getAttribute("data-view"), notifOpen: false, menuOpen: false }); }; });
    $$("[data-go]").forEach(function (b) { b.onclick = function () { set({ view: b.getAttribute("data-go") }); }; });
    $$("[data-as]").forEach(function (b) { b.onclick = function () { set({ as: b.getAttribute("data-as") }); }; });
    $$("[data-guest]").forEach(function (b) { b.onclick = function () { set({ guest: b.getAttribute("data-guest") }); }; });
    $$("[data-guestopen]").forEach(function (b) { b.onclick = function () { set({ guest: b.getAttribute("data-guestopen"), askOpen: false }); }; });
    $$("[data-close]").forEach(function (b) { b.onclick = function () { var k = b.getAttribute("data-close"); var p = {}; p[k === "guest" ? "guest" : k + "Open"] = k === "guest" ? null : false; set(p); }; });
    $$("[data-tier]").forEach(function (b) { b.onclick = function () { set({ tierFilter: b.getAttribute("data-tier") }); }; });
    $$("[data-f]").forEach(function (b) { b.onclick = function () { set({ filter: b.getAttribute("data-f") }); }; });
    $$("[data-day]").forEach(function (b) { b.onclick = function () { set({ day: +b.getAttribute("data-day") }); }; });
    $$("[data-car]").forEach(function (b) { b.onclick = function () { set({ assigned: { code: b.getAttribute("data-car"), seats: +b.getAttribute("data-seats") } }); }; });
    $$("[data-mod]").forEach(function (b) { b.onclick = function () { set({ module: b.getAttribute("data-mod") }); }; });
    $$("[data-pstep]").forEach(function (b) { b.onclick = function () { S.plusDone[b.getAttribute("data-pstep")] = true; render(); }; });
    $$("[data-ask]").forEach(function (b) { b.onclick = function () { var i = +b.getAttribute("data-ask"); S.ask.push('<div class="msg me">' + esc(b.textContent) + '</div>', ANSWERS[i]); render(); var l = $("#askLog"); if (l) l.scrollTop = l.scrollHeight; }; });
    var on = function (id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; };
    on("fab", function () { set({ askOpen: !S.askOpen, notifOpen: false, menuOpen: false }); });
    on("askClose", function () { set({ askOpen: false }); });
    on("bellBtn", function () { set({ notifOpen: !S.notifOpen, menuOpen: false }); });
    on("avatarBtn", function () { set({ menuOpen: !S.menuOpen, notifOpen: false }); });
    on("startTour", function () { startTour(); });
    on("openPartner", function () { set({ partnerOpen: true, menuOpen: false }); });
    on("swCodesign", function () { var v = !S.codesign; set({ codesign: v, view: (!v && (S.view === "team" || S.view === "protocols" || S.view === "costs")) ? "home" : S.view }); });
    on("importBtn", function () { set({ importOpen: true, importStage: 0 }); });
    on("readFile", function () { set({ importStage: S.importStage + 1 }); });
    on("plusBtn", function () { set({ plus: 1 }); });
    on("tellMaison", function () { set({ plus: 2 }); });
    on("groundBtn", function () { set({ ground: S.ground + 1 }); });
    on("onboardBtn", function () { set({ onboarded: 22 }); });
    on("runProto", function () { set({ proto: 1 }); });
    on("protoNext", function () { set({ proto: 2 }); });
    on("addItem", function () { var m = MODULES.find(function (x) { return x.key === S.module; }); m.items.push(["New item in " + m.label, "proposed"]); render(); });
    on("tourNext", function () { if (S.tour >= TOUR.length - 1) endTour(); else goTour(S.tour + 1); });
    on("tourBack", function () { goTour(S.tour - 1); });
    on("tourSkip", endTour);
    var ft = $("#fleetTime"); if (ft) ft.onchange = function () { set({ fleetTime: ft.value || "18:30", assigned: null }); };
  }

  function startTour() { set({ menuOpen: false, notifOpen: false, askOpen: false, guest: null, importOpen: false, partnerOpen: false, codesign: true }); goTour(0); }
  function goTour(i) { S.tour = i; S.view = TOUR[i].view; render(); }
  function endTour() { try { localStorage.setItem("ellie-demo-tour", "done"); } catch (e) {} set({ tour: -1 }); }
  function placeTour() {
    var step = TOUR[S.tour], el = $(step.target), hole = $("#tourHole"), card = $("#tourCard");
    if (!hole || !card) return;
    if (!el) { hole.style.display = "none"; card.style.left = "50%"; card.style.top = "50%"; card.style.transform = "translate(-50%,-50%)"; return; }
    el.scrollIntoView({ block: "center", inline: "nearest" });
    requestAnimationFrame(function () {
      var r = el.getBoundingClientRect(), pad = 6, vw = innerWidth, vh = innerHeight;
      hole.style.left = (r.left - pad) + "px"; hole.style.top = (r.top - pad) + "px"; hole.style.width = (r.width + pad * 2) + "px"; hole.style.height = (r.height + pad * 2) + "px";
      var cr = card.getBoundingClientRect(), gap = 14, left, top;
      if (r.right + gap + cr.width < vw - 16) { left = r.right + gap; top = Math.min(Math.max(16, r.top), vh - cr.height - 16); }
      else if (r.bottom + gap + cr.height < vh - 16) { left = Math.min(Math.max(16, r.left), vw - cr.width - 16); top = r.bottom + gap; }
      else if (r.top - gap - cr.height > 16) { left = Math.min(Math.max(16, r.left), vw - cr.width - 16); top = r.top - gap - cr.height; }
      else { left = Math.max(16, (vw - cr.width) / 2); top = Math.max(16, vh - cr.height - 16); }
      card.style.left = left + "px"; card.style.top = top + "px"; card.style.transform = "none";
    });
  }
  addEventListener("resize", function () { if (S.tour >= 0) placeTour(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (S.tour >= 0) endTour(); else set({ guest: null, importOpen: false, partnerOpen: false, menuOpen: false, notifOpen: false, askOpen: false }); }
    if (S.tour >= 0 && e.key === "ArrowRight") { if (S.tour < TOUR.length - 1) goTour(S.tour + 1); else endTour(); }
    if (S.tour >= 0 && e.key === "ArrowLeft" && S.tour > 0) goTour(S.tour - 1);
  });

  render();
  var seen = null; try { seen = localStorage.getItem("ellie-demo-tour"); } catch (e) {}
  if (seen !== "done") setTimeout(function () { goTour(0); }, 400);
})();
</script>
</body>
</html>
