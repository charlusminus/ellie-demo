<!doctype html>
<html lang="en">
<head>

<title>Ellie for DMCs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: built for a projector. A header with the three modules and the team impact, then the story on the left and a live Ellie screen on the right. */
:root {
  --ink: #fbf9f5;
  --panel: #ffffff;
  --panel-2: #f9f6ef;
  --panel-3: #f1ece2;
  --line: #e4dccc;
  --text: #0b1f3a;
  --muted: #5f6a7c;
  --gold: #7a5c24;
  --gold-ink: #fdfbf7;
  --ok: #2e6b4f;
  --warn: #8a6212;
  --crit: #a03d33;
  --soon: #3d5a96;
  --wash: rgba(176, 141, 74, .12);
  --shade: rgba(7, 26, 51, .42);
  --line-strong: #cfc3ab;
  --grid: rgba(11, 31, 58, .07);
  --win-bg: rgba(46, 107, 79, .07); --win-line: rgba(46, 107, 79, .3);
  --other-bg: rgba(160, 61, 51, .16); --vip-bg: rgba(176, 141, 74, .22); --bad-bg: rgba(160, 61, 51, .12);
  --river: #c9d6e3;
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
/* Ellie's dark theme, the default of this demo (same tokens as the app). */
:root[data-theme="dark"] {
  --ink: #051324; --panel: #0a2444; --panel-2: #0d2c54; --panel-3: #143766;
  --line: rgba(255, 255, 255, .14); --line-strong: rgba(255, 255, 255, .28);
  --text: #f7f3ea; --muted: #aeb9cc;
  --gold: #d8b873; --gold-ink: #051324;
  --ok: #8fd49e; --warn: #e3bc5e; --crit: #e39b8c; --soon: #9db0e0;
  --wash: rgba(216, 184, 115, .12); --shade: rgba(2, 8, 16, .62);
  --grid: rgba(255, 255, 255, .06);
  --win-bg: rgba(143, 212, 158, .08); --win-line: rgba(143, 212, 158, .35);
  --other-bg: rgba(227, 155, 140, .22); --vip-bg: rgba(216, 184, 115, .25); --bad-bg: rgba(227, 155, 140, .2);
  --river: #1d4675;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: clamp(14px, 0.55vw + 8.5px, 21px); }
html, body { background: var(--ink); color: var(--text); margin: 0; }
body { font-family: var(--body); line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input { font: inherit; color: var(--text); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: env(safe-area-inset-top, 0px) max(1rem, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(1rem, env(safe-area-inset-left, 0px)); gap: .8rem; }
@media (min-width: 1100px) and (min-height: 640px) { .app { height: 100vh; } }

/* header */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: .6rem 1.2rem; flex-wrap: wrap; padding-top: .8rem; }
.hl { display: flex; align-items: baseline; gap: .4rem 1rem; flex-wrap: wrap; min-width: 0; }
.brand { font-family: var(--display); font-size: 1.6rem; letter-spacing: .3em; font-weight: 600; }
.evt { font-family: var(--display); font-size: 1.15rem; }
.evt i { color: var(--gold); }
.evt .by { font-family: var(--body); font-size: .8rem; color: var(--muted); }
.mods { display: flex; gap: .4rem; flex-wrap: wrap; }
.mods button { border: 1px solid var(--line); border-radius: 999px; padding: .3rem .8rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mods button[aria-current="true"] { border-color: var(--gold); color: var(--text); background: var(--panel-2); }
.mods button.done { color: var(--text); }
.tools { display: flex; gap: .4rem; align-items: center; }
.tools button { border: 1px solid var(--line); border-radius: 8px; padding: .3rem .6rem; font-size: .78rem; color: var(--muted); }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--text); }

/* impact meter */
.meter { display: flex; gap: .4rem 1.2rem; align-items: baseline; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: .45rem .9rem; background: var(--panel); }
.meter .lab { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.meter b { font-size: 1.15rem; color: var(--gold); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.meter span.u { font-size: .78rem; color: var(--muted); margin-left: .25rem; }
.meter .ill { font-size: .68rem; color: var(--muted); font-style: italic; }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 36fr) minmax(0, 64fr); gap: 1.2rem; min-height: 0; }
@media (max-width: 1099px) { .stage { grid-template-columns: 1fr; } }
.story { display: flex; flex-direction: column; gap: .8rem; min-height: 0; overflow-y: auto; padding-right: .2rem; }
.screen { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(11,31,58,.04); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
.screen .bar { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.screen .bar .where { font-size: .82rem; color: var(--muted); }
.screen .bar .where b { color: var(--text); font-weight: 500; }
.live { font-size: .68rem; letter-spacing: .1em; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: .1rem .5rem; }
.sbody { padding: 1rem; overflow-y: auto; display: grid; gap: .8rem; align-content: start; min-height: 0; }

.kicker { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.badge { border: 1px solid currentColor; border-radius: 999px; padding: .08rem .5rem; font-size: .66rem; letter-spacing: .08em; }
.badge.today { color: var(--ok); } .badge.soon { color: var(--soon); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 2.35rem; line-height: 1.05; }
h2 { font-size: 1.9rem; line-height: 1.08; }
h3 { font-size: 1.2rem; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.person { display: flex; gap: .7rem; align-items: center; }
.av { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-weight: 600; display: grid; place-items: center; font-size: .85rem; flex: 0 0 auto; }
.person .n { font-weight: 600; } .person .r { color: var(--muted); font-size: .85rem; }
.ba { display: grid; gap: .45rem; }
.ba .row2 { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .6rem; align-items: start; padding: .55rem .7rem; border-radius: 8px; border: 1px solid var(--line); }
.ba .row2 .t { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding-top: .15rem; }
.ba .before { color: var(--muted); }
.ba .before .t { color: var(--muted); }
.ba .after { border-color: var(--gold); background: var(--wash); }
.ba .after .t { color: var(--gold); }
.gain { display: flex; gap: .4rem; flex-wrap: wrap; }
.gain span { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: .15rem .55rem; color: var(--muted); }
.gain span b { color: var(--gold); font-weight: 600; }
.built { font-size: .8rem; color: var(--soon); border-left: 2px solid var(--soon); padding-left: .6rem; }
.priv { font-size: .8rem; color: var(--ok); border-left: 2px solid var(--ok); padding-left: .6rem; }
.sw { width: 2.4rem; height: 1.35rem; border-radius: 999px; background: var(--panel-3); border: 1px solid var(--line-strong); position: relative; flex: 0 0 auto; }
.sw::after { content: ""; position: absolute; top: .12rem; left: .12rem; width: .95rem; height: .95rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
.sw[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.sw[aria-checked="true"]::after { left: 1.25rem; }
.mapcar { transition: transform .8s ease; }
.nav { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem; }
.btn { border-radius: 8px; padding: .55rem 1rem; border: 1px solid var(--line); font-size: .9rem; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.btn.sm { padding: .3rem .65rem; font-size: .8rem; }
.btn[disabled] { opacity: .45; cursor: default; }

/* screen elements */
.label { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .75rem; flex-wrap: wrap; }
.row .l { display: grid; gap: .1rem; min-width: 0; }
.row .t { font-weight: 500; }
.s { color: var(--muted); font-size: .82rem; }
.code { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.pill { font-size: .7rem; border-radius: 999px; padding: .1rem .55rem; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); } .pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.crit { color: var(--crit); border-color: var(--crit); } .pill.soon { color: var(--soon); border-color: var(--soon); }
.chips { display: flex; gap: .45rem; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: .3rem .75rem; font-size: .82rem; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: var(--wash); }
.chip .c { color: var(--gold); margin-left: .35rem; font-variant-numeric: tabular-nums; }
.chip .rk { display: inline-grid; place-items: center; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-size: .7rem; font-weight: 700; margin-right: .35rem; }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: .55rem .75rem; font-size: .85rem; }
.banner.ok { border-color: var(--ok); color: var(--ok); } .banner.crit { border-color: var(--crit); color: var(--crit); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
@media (max-width: 700px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: .75rem; display: grid; gap: .35rem; align-content: start; }
.kpi { font-size: 1.6rem; line-height: 1.1; color: var(--text); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: .45rem .55rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
td.num, th.num { text-align: right; }
tr.hl td { background: var(--wash); }

/* frame table on the intro */
.frame td, .frame th { white-space: normal; vertical-align: top; }
.frame tr.sel td { background: var(--wash); }
.frame td:first-child { font-weight: 600; }

/* gantt */
.gantt { display: grid; gap: .3rem; }
.g-head, .g-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .5rem; align-items: center; }
.g-hours { position: relative; height: 1.1rem; }
.g-hours span { position: absolute; transform: translateX(-50%); font-size: .66rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.g-lab { font-size: .8rem; } .g-lab b { font-weight: 600; } .g-lab .s { font-size: .7rem; }
.g-track { position: relative; height: 2.1rem; border-radius: 6px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100%/18 - 1px), var(--grid) calc(100%/18 - 1px), var(--grid) calc(100%/18)); border: 1px solid var(--line); overflow: hidden; }
.g-win { position: absolute; top: 0; bottom: 0; background: var(--win-bg); border-left: 1px solid var(--win-line); border-right: 1px solid var(--win-line); }
.g-other { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--other-bg) 0 6px, transparent 6px 12px); }
.g-blk { position: absolute; top: .25rem; bottom: .25rem; border-radius: 5px; background: var(--panel-3); border: 1px solid var(--gold); font-size: .66rem; padding: 0 .3rem; display: flex; align-items: center; overflow: hidden; white-space: nowrap; color: var(--text); }
.g-blk.vip { background: var(--vip-bg); }
.g-blk.new { background: var(--gold); color: var(--gold-ink); font-weight: 600; }
.g-blk.bad { border-color: var(--crit); background: var(--bad-bg); }
.g-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .72rem; color: var(--muted); }
.legend i { display: inline-block; width: .9rem; height: .6rem; border-radius: 2px; margin-right: .3rem; vertical-align: middle; }

/* kanban */
.kan { display: grid; grid-template-columns: repeat(4, minmax(9rem, 1fr)); gap: .6rem; overflow-x: auto; }
.kcol { display: grid; gap: .45rem; align-content: start; }
.kcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; display: grid; gap: .25rem; }
.kcard.blocked { border-left: 3px solid var(--crit); }
.kcard .acts { display: flex; gap: .3rem; flex-wrap: wrap; }

/* tasks */
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .65rem; }
.task input { width: 1.05rem; height: 1.05rem; accent-color: var(--gold); }
.task.done .tt { text-decoration: line-through; color: var(--muted); }
.task .tt { font-size: .88rem; }
.task .own { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* phone */
.duo { display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }
.phone { border: 1px solid var(--line); border-radius: 1.6rem; padding: .8rem; background: var(--ink); display: grid; gap: .55rem; }
.bub { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: .5rem .65rem; font-size: .8rem; }
.bub.me { background: var(--wash); border-color: var(--gold); justify-self: end; }
.bub .w { font-size: .66rem; color: var(--muted); display: block; }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.stat button { border: 1px solid var(--line); border-radius: 10px; padding: .45rem; font-size: .78rem; background: var(--panel-2); }
.stat button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
.steps4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .3rem; }
.steps4 div { border: 1px solid var(--line); border-radius: 6px; padding: .35rem; font-size: .7rem; text-align: center; color: var(--muted); }
.steps4 div.on { border-color: var(--ok); color: var(--ok); }

/* bars */
.bars { display: grid; gap: .35rem; }
.bl { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) 4rem; gap: .6rem; align-items: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
.bl .tr { height: .7rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.bl .f { display: block; height: 100%; background: var(--gold); }
.bl .f.hot { background: var(--crit); }
.bl .v { text-align: right; color: var(--muted); }
.progress { height: .55rem; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .5s ease; }

/* notes and footer */
.notes { border: 1px dashed var(--gold); border-radius: 10px; padding: .7rem .9rem; display: grid; gap: .35rem; font-size: .85rem; background: var(--wash); }
.notes b { color: var(--gold); font-weight: 600; }
.foot { font-size: .72rem; color: var(--muted); text-align: center; padding-bottom: .6rem; }
.fade { animation: fade .3s ease both; }
@keyframes fade { from { opacity: .3; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (max-height: 820px) and (min-width: 1100px) { html { font-size: 14.5px; } .foot { display: none; } h2 { font-size: 1.7rem; } .meter { padding: .35rem .8rem; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .progress i, .mapcar, .sw::after { transition: none; } }
</style>

          (sc.before ? '<div class="ba"><div class="row2 before"><span class="t">Today</span><span>' + sc.before + '</span></div><div class="row2 after"><span class="t">With Ellie</span><span>' + sc.after + '</span></div></div>' : '') +
          (sc.impact ? '<div class="gain">' + (sc.impact.hours ? '<span><b>' + sc.impact.hours + ' h</b> given back</span>' : '') + (sc.impact.calls ? '<span><b>' + sc.impact.calls + '</b> calls not made</span>' : '') + (sc.impact.messages ? '<span><b>' + sc.impact.messages + '</b> messages not sent</span>' : '') + (sc.impact.caught ? '<span><b>' + sc.impact.caught + '</b> ' + (sc.impact.caught > 1 ? 'problems' : 'problem') + ' seen early</span>' : '') + '</div>' : '') +
          (S.notes ? '<div class="notes">' + (sc.notes.say ? '<span><b>Say.</b> ' + sc.notes.say + '</span>' : '') + (sc.notes.live ? '<span><b>Show it live in Ellie.</b> ' + sc.notes.live + '</span>' : (sc.status === "soon" ? '<span><b>Not in Ellie yet.</b> Present it as a proposal to design together.</span>' : '')) + (sc.notes.ask ? '<span><b>Ask.</b> ' + sc.notes.ask + '</span>' : '') + '</div>' : '') +
          '<div class="nav">' + (S.i > 0 ? '<button class="btn" id="prev">Back</button>' : '') + (S.i < SCENES.length - 1 ? '<button class="btn primary" id="next">' + (S.i === 0 ? "Start with the brief" : "Next") + '</button>' : '') + '</div>' +
        '</section>' +
        '<section class="screen" aria-label="Ellie screen">' +
          '<div class="bar"><span class="where">' + (sc.status === "soon" ? "Proposal · " : "") + '<b>' + sc.where + '</b></span>' + (sc.status === "today" ? '<span class="live">IN ELLIE TODAY</span>' : sc.status === "soon" ? '<span class="live" style="color:var(--soon);border-color:var(--soon)">IN CO-DESIGN</span>' : '') + '</div>' +
          '<div class="sbody" id="sbody">' + sc.screen() + '</div>' +
        '</section>' +
      '</div>' +
      '<div class="meter" role="status" aria-label="Team impact so far"><span class="lab">Given back to your team so far</span><span><b>' + imp.hours + '</b><span class="u">hours</span></span><span><b>' + imp.calls + '</b><span class="u">calls not made</span></span><span><b>' + imp.messages + '</b><span class="u">messages not sent</span></span><span><b>' + imp.caught + '</b><span class="u">problems seen before the guest</span></span><span class="ill">Illustrative orders of magnitude for one 30-guest event, to measure together in the pilot</span></div>' +
      '<p class="foot">Fictional guests, hotels, cars and costs. "In Ellie today" is in the product now; "In co-design" is a proposal to build with the agency. Arrow keys to move, N for notes, T for the light or dark theme, F for full screen.</p>';
    var sb = $("#sbody"), keep = sb ? sb.scrollTop : 0, sameScene = render.last === S.i;
    $("#app").innerHTML = html;
    if (sameScene) $("#sbody").scrollTop = keep;
    render.last = S.i;
    wire(sc);
  }
  function wire(sc) {
    var on = function (id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; };
    on("prev", function () { go(S.i - 1); });
    on("next", function () { go(S.i + 1); });
    on("notesBtn", function () { S.notes = !S.notes; render(); });
    on("themeBtn", toggleTheme);
    on("fsBtn", toggleFs);
    $$("[data-mod]").forEach(function (b) { b.onclick = function () { go(+b.getAttribute("data-mod")); }; });
    if (sc.wire) sc.wire();
  }
  function applyTheme() { document.documentElement.setAttribute("data-theme", S.theme); }
  function toggleTheme() { S.theme = S.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("ellie-demo-theme", S.theme); } catch (e) {} applyTheme(); render(); }
  function toggleFs() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
  }
  function go(i) {
    S.i = Math.max(0, Math.min(SCENES.length - 1, i));
    var id = SCENES[S.i].id;
    if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
    render();
    window.scrollTo(0, 0);
  }
  function fromHash() {
    var id = (location.hash || "").replace("#", "");
    var k = SCENES.findIndex(function (s) { return s.id === id; });
    S.i = k >= 0 ? k : 0;
    render();
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") go(S.i + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(S.i - 1);
    else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; render(); }
    else if (e.key === "f" || e.key === "F") toggleFs();
    else if (e.key === "t" || e.key === "T") toggleTheme();
    else if (e.key === "Home") go(0);
  });
  window.addEventListener("hashchange", fromHash);
  applyTheme();
  fromHash();
})();
</script>
</body>
</html>
