<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ellie for a DMC: a day of transport, from the brief to the review.">
<title>Ellie for DMCs</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* One look, dark only: the Ellie charter, night blue and gold (decision of 15/11/2026; the two other looks and the light
   theme were dropped). No tools in the header: N shows the presenter notes, F goes full screen.
   Layout: built for a projector. The story on the left, a live Ellie screen on the right, one counter at the bottom.
   No cards inside the screen: sections are separated by space and hairlines. One status marker per scene, in the screen bar. */

/* ---------- "Maison de nuit": night blue, ivory, gold kept for the one filled button. Didone titles. */
:root[data-look="a"] {
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: var(--f-body); --f-kpi: var(--f-display);
  --title-w: 500; --title-ls: -0.012em; --title-lh: 1.08; --title-1: 3rem; --title-2: 2.55rem; --title-opsz: 18;
  --nav-tt: uppercase; --nav-ls: .1em; --nav-size: var(--fs-s);
  --fs-s: .9rem; --fs-b: 1rem; --fs-l: 1.15rem; --fs-sub: 1.5rem; --fs-num: 1.9rem;
  --radius: 2px; --radius-lg: 4px;
  --brand-font: var(--f-display); --brand-ls: .36em; --brand-w: 500; --brand-size: 1.3rem;
}
:root[data-look="a"][data-theme="dark"] {
  --bg: #070d1a; --surface: #0c1628; --raised: #132240;
  --text: #ece6d8; --muted: #c2bcaf; --line: rgba(236, 230, 216, .13); --line-strong: #62708a;
  --accent: #cfab63; --btn-bg: #cfab63; --btn-ink: #0a0f1a;
  --ok: #86c7a0; --warn: #e0b25a; --crit: #e89482; --soon: #a3b6ea;
}



/* Contrast, measured on the worst ground (design/contrast.py): text and statuses at 4.5 or more,
   control borders (--line-strong) at 3.0 or more. Exception: --line is a decorative hairline between rows, about 1.3 to 1,
   never the only cue for a control or a state. */
/* Derived tints. */
:root {
  --wash: color-mix(in srgb, var(--accent) 9%, transparent);
  --grid: color-mix(in srgb, var(--text) 6%, transparent);
  --win-bg: color-mix(in srgb, var(--text) 9%, var(--surface));
  --vip-bg: color-mix(in srgb, var(--accent) 22%, var(--surface));
  --other: color-mix(in srgb, var(--crit) 45%, transparent);
  --bad-bg: color-mix(in srgb, var(--crit) 16%, var(--surface));
  --river: color-mix(in srgb, var(--soon) 26%, var(--surface));
  --map-bg: var(--bg); --map-street: color-mix(in srgb, var(--text) 6%, transparent);
  --map-road: color-mix(in srgb, var(--text) 13%, var(--bg)); --map-exp: color-mix(in srgb, var(--text) 24%, var(--bg));
  --map-park: color-mix(in srgb, var(--ok) 10%, var(--bg));
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
b, strong { font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html { font-size: clamp(14px, 0.55vw + 8.5px, 21px); }
html, body { background: var(--bg); color: var(--text); margin: 0; }
body { font-family: var(--f-body); line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input { font: inherit; color: var(--text); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* A faded picture behind the story, one per scene (the website's pictures). It fades out towards the Ellie screen on
   desktop and towards the bottom on small screens. Opacity .2 keeps the muted text above 4.5:1 even on a white pixel. */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: center / cover no-repeat; opacity: .2;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, .75) 28%, transparent 52%);
  mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, .75) 28%, transparent 52%); }
.backdrop.in { animation: bdin .7s ease both; }
@keyframes bdin { from { opacity: 0; } to { opacity: .2; } }
@media (max-width: 1099px) {
  .backdrop { -webkit-mask-image: linear-gradient(180deg, #000 0, rgba(0, 0, 0, .6) 40vh, transparent 75vh);
    mask-image: linear-gradient(180deg, #000 0, rgba(0, 0, 0, .6) 40vh, transparent 75vh); }
}
@media (prefers-reduced-motion: reduce) { .backdrop.in { animation: none; } }
.app { position: relative; z-index: 1; }
.app { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.2rem;
  padding: env(safe-area-inset-top, 0px) max(1.6rem, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(1.6rem, env(safe-area-inset-left, 0px)); }
@media (min-width: 1100px) and (min-height: 640px) { .app { height: 100vh; } }
@media (max-width: 700px) { .app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* shared text styles */
.label { font-size: var(--fs-s); color: var(--muted); }
.mods .label, .who { font-size: var(--nav-size); letter-spacing: var(--nav-ls); text-transform: var(--nav-tt); }
.s { color: var(--muted); font-size: var(--fs-s); }
.t { color: var(--text); }
.code { font-family: var(--f-num); color: var(--accent); font-variant-numeric: tabular-nums; }
.tn { font-family: var(--f-num); font-variant-numeric: tabular-nums; }


/* header */
.hdr { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem 2rem; flex-wrap: wrap; padding-top: 1.1rem; }
.brand { display: inline-flex; vertical-align: middle; color: var(--text); padding: .2rem 0; }
.brand svg { height: .95rem; width: auto; display: block; }
:root[data-look="a"] .brand { color: var(--accent); }
.evt { color: var(--muted); font-size: var(--fs-s); margin-left: 1.2rem; }
.mods { display: flex; gap: 1.8rem; }
.mods button { padding: .25rem 0; border-bottom: 1px solid transparent; }
.mods button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 34fr) minmax(0, 66fr); gap: 2.6rem; min-height: 0; }
@media (max-width: 1099px) { .stage { grid-template-columns: 1fr; gap: 1.6rem; } }
.story { display: flex; flex-direction: column; gap: 1rem; min-height: 0; overflow-y: auto; padding: .8rem .2rem .2rem 0; }
.who b { color: var(--text); }
h1, h2 { font-family: var(--f-display); font-weight: var(--title-w); letter-spacing: var(--title-ls); line-height: var(--title-lh); margin: 0; text-wrap: balance; font-variation-settings: "opsz" var(--title-opsz, 14); }
h1 { font-size: var(--title-1); }
h2 { font-size: var(--title-2); }
.lede { color: var(--muted); font-size: var(--fs-l); max-width: 40ch; margin: 0; }
.ba { margin: .9rem 0 0; }
.ba > div { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 1rem; padding: .65rem 0; border-top: 1px solid var(--line); }
.ba dt { padding-top: .12rem; }
.ba dd { margin: 0; color: var(--muted); font-size: var(--fs-b); }
.ba .after dd { color: var(--text); }
.priv { margin: 0; font-size: var(--fs-s); color: var(--muted); }
.notes { border-top: 1px dashed var(--line-strong); padding-top: .8rem; display: grid; gap: .4rem; font-size: var(--fs-s); color: var(--muted); }
.notes b { color: var(--text); }
.nav { display: flex; align-items: center; gap: .6rem; margin-top: auto; padding-top: .4rem; }
.nav .pos { font-size: var(--fs-s); color: var(--muted); margin-left: .6rem; }
.nav .notes-btn { margin-left: auto; }
@media (hover: none) { .nav .notes-btn { display: none; } }
.notes { position: relative; }
.notes .notes-close { justify-self: end; }

/* Small screens (Alex, 16/11): the reading order is title, text, the Ellie screen, then Today and With Ellie;
   Back and Next live in a bar fixed at the bottom, so they never cut the content. */
@media (max-width: 1099px) {
  .stage { display: flex; flex-direction: column; gap: 1.1rem; }
  .story { display: contents; }
  .story > .who { order: 1; }
  .story > h1, .story > h2 { order: 2; }
  .story > .lede { order: 3; }
  .story > .priv { order: 4; }
  .screen { order: 5; margin-top: .6rem; }
  .story > .ba { order: 6; }
  .story > .notes { order: 7; }
  .story > .nav { order: 8; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding: .7rem max(16px, env(safe-area-inset-right, 0px)) calc(.7rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .story > .nav .pos { margin-left: auto; }
  .app { padding-bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 700px) {
  h1 { font-size: 2.35rem; }
  h2 { font-size: 2.05rem; }
  .stage { gap: 1rem; }
  .screen .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .screen .tabs button { white-space: nowrap; }
  .app .meter { display: none; }
}

.btn { border-radius: var(--radius); padding: .55rem 1.2rem; border: 1px solid var(--line-strong); font-size: var(--fs-b); }
.btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); font-weight: 500; }
.btn.sm { padding: .3rem .8rem; font-size: var(--fs-s); }
.btn[disabled] { opacity: .45; cursor: default; }
.link { font-size: var(--fs-s); color: var(--muted); text-decoration: underline; text-underline-offset: .22em; }
.link:hover { color: var(--text); }

/* the Ellie screen */
.screen { background: var(--surface); border-radius: var(--radius-lg); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; max-height: 100%; align-self: start; overflow: hidden; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1.2rem 1.6rem 0; flex-wrap: wrap; }
.state { font-size: var(--fs-s); }
.sbody { padding: 1rem 1.6rem 1.5rem; overflow-y: auto; display: grid; gap: 1rem; align-content: start; min-height: 0; }
.sec { display: grid; gap: 0; align-content: start; min-width: 0; }
.sec > .label { padding-bottom: .45rem; border-bottom: 1px solid var(--line); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2rem; }
@media (max-width: 700px) { .cols2 { grid-template-columns: 1fr; gap: 1.2rem; } }

.line { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.line .l { display: grid; gap: .1rem; min-width: 0; }
.line.sel { background: var(--wash); box-shadow: -.6rem 0 0 var(--wash), .6rem 0 0 var(--wash); }
.prow { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 1rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--line); }

/* one status style: a coloured word */
.st { font-size: var(--fs-s); white-space: nowrap; color: var(--muted); }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.crit { color: var(--crit); } .st.soon { color: var(--soon); }
.crit { color: var(--crit); } .ok { color: var(--ok); } .warn { color: var(--warn); }

/* Tabs read as buttons: a framed pill each, the chosen one in gold. */
.tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
.tabs button { padding: .35rem .95rem; font-size: var(--fs-b); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; transition: border-color .15s, color .15s, background-color .15s; }
.tabs button:hover { border-color: var(--text); color: var(--text); }
.tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--wash); }
.tabs .nx { margin-left: .45rem; font-size: var(--fs-s); color: var(--soon); }
.note.soon { border-color: var(--soon); color: var(--soon); }
.tabs .c { font-family: var(--f-num); font-size: var(--fs-s); margin-left: .4rem; }

.note { margin: 0; border-left: 2px solid var(--line-strong); padding: .15rem 0 .15rem .85rem; font-size: var(--fs-b); }
.note.ok { border-color: var(--ok); } .note.warn { border-color: var(--warn); } .note.crit { border-color: var(--crit); }
.sum { margin: 0; font-size: var(--fs-s); color: var(--muted); }
.alert { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.alert b { font-size: var(--fs-sub); font-weight: 400; letter-spacing: -.01em; }
.t > span + span { margin-left: .7rem; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 1.6rem; }
.kpi { display: grid; gap: .1rem; }
.kpi b { font-variation-settings: "opsz" var(--title-opsz, 14); font-family: var(--f-kpi); font-weight: var(--title-w); font-size: var(--fs-num); line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; letter-spacing: var(--title-ls); }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-b); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: .55rem .8rem .55rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 400; color: var(--muted); }
td.num, th.num { text-align: right; padding-right: 0; font-family: var(--f-num); white-space: nowrap; }
.sides { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sides .t { font-family: var(--f-display); font-weight: var(--title-w); letter-spacing: var(--title-ls); font-size: var(--fs-sub); line-height: 1.15; font-variation-settings: "opsz" var(--title-opsz, 14); }
.sides button:not([aria-pressed="true"]) .t { color: var(--muted); }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6rem; padding-bottom: .4rem; }
.tri div { display: grid; gap: .25rem; align-content: start; }
@media (max-width: 700px) { .tri { grid-template-columns: 1fr; gap: .8rem; } }
.prow.wide { grid-template-columns: 11rem minmax(0, 1fr) auto; }
@media (max-width: 700px) { .prow.wide { grid-template-columns: 7rem minmax(0, 1fr); } .prow.wide > :last-child { grid-column: 2; } }

.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 1.2rem; }
.team button { display: grid; gap: .1rem; text-align: left; align-content: start; padding: .65rem 0 0; border-top: 1px solid var(--line-strong); }
.team button[aria-pressed="true"] { border-top: 2px solid var(--accent); padding-top: calc(.65rem - 1px); }

/* First screen: the side and the profile are choices. A frame, a selection mark, gold on the one chosen. */
.team.sides { gap: 1rem; }
.team.sides button, .team.sides button[aria-pressed="true"] { position: relative; border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
  padding: .95rem 1rem 1rem 2.9rem; gap: .25rem; transition: border-color .15s, background-color .15s; }
.team.sides button::before { content: ""; position: absolute; left: 1.05rem; top: 1.4rem; width: 1rem; height: 1rem; border-radius: 50%;
  border: 1.5px solid var(--line-strong); box-sizing: border-box; }
.team.sides button:hover { border-color: var(--text); }
.team.sides button[aria-pressed="true"] { border-color: var(--accent); background: var(--wash); }
.team.sides button[aria-pressed="true"]::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 38%, transparent 44%); }
.team.sides .s { font-size: var(--fs-b); }
.team.who-pick { grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .8rem; }
.team.who-pick button, .team.who-pick button[aria-pressed="true"] { grid-template-columns: 2.2rem minmax(0, 1fr); column-gap: .75rem; row-gap: .05rem; align-items: center;
  border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: .65rem .85rem; transition: border-color .15s, background-color .15s; }
.team.who-pick .ic { grid-row: 1 / span 2; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--muted); }
.team.who-pick .ic svg { width: 1.2rem; height: 1.2rem; }
.team.who-pick button:hover { border-color: var(--text); }
.team.who-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--wash); }
.team.who-pick button[aria-pressed="true"] .ic { border-color: var(--accent); color: var(--accent); }
.mods button[disabled] { opacity: .35; cursor: default; }

/* transport plan */
.gantt { display: grid; gap: .22rem; }
.g-head, .g-row { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: .6rem; align-items: center; }
.g-hours { position: relative; height: 1.1rem; }
.g-hours span { position: absolute; transform: translateX(-50%); font-family: var(--f-num); font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.g-hours .g-nowlab { color: var(--text); font-weight: 500; background: var(--surface); padding: 0 .3rem; z-index: 1; }
.g-lab { font-size: var(--fs-b); white-space: nowrap; }
.g-track { position: relative; height: 2.25rem; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100%/18 - 1px), var(--grid) calc(100%/18 - 1px), var(--grid) calc(100%/18)); border-bottom: 1px solid var(--line); }
.g-win { position: absolute; top: 0; bottom: 0; background: var(--win-bg); border-left: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }
.g-other { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--other) 0 5px, transparent 5px 10px); }
.g-blk { position: absolute; top: .3rem; height: 1.65rem; min-width: max-content; border-radius: min(var(--radius), 3px); background: var(--raised); border: 1px solid var(--line-strong); font-family: var(--f-num); font-size: var(--fs-s); font-weight: 500; padding: 0 .45rem; display: flex; align-items: center; white-space: nowrap; }
.g-blk.none { background: var(--bad-bg); border-color: var(--crit); color: var(--crit); }
.g-row.nocar .g-track { background: none; }
.g-row.nocar .g-lab { color: var(--crit); }
.g-blk.vip { background: var(--vip-bg); border-color: var(--accent); }
.g-blk.new { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); font-weight: 500; }
.g-blk.bad { border-color: var(--crit); background: var(--bad-bg); }
.g-now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text); }
.legend { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: var(--fs-s); color: var(--muted); }
.legend i { display: inline-block; width: .9rem; height: .55rem; margin-right: .4rem; vertical-align: middle; }
.stepper { display: inline-flex; align-items: baseline; gap: .5rem; margin-left: .4rem; }
.stepper b { font-family: var(--f-num); font-size: var(--fs-l); font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.stepper button { width: 1.5rem; color: var(--muted); font-size: var(--fs-l); }
.stepper button:hover { color: var(--text); }
/* A priority action in a list (Assign, Approve): a small gold-outlined button, not a link. */
.link.strong { color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: var(--radius); padding: .3rem .85rem; white-space: nowrap; transition: background-color .15s, color .15s; }
.link.strong:hover { background: var(--btn-bg); color: var(--btn-ink); }

/* board */
.kan { display: grid; grid-template-columns: repeat(4, minmax(8.5rem, 1fr)); gap: 1.6rem; overflow-x: auto; }
.kcard { padding: .6rem 0; border-bottom: 1px solid var(--line); display: grid; gap: .25rem; }
.kcard.blocked { box-shadow: inset 2px 0 0 var(--crit); padding-left: .7rem; }
.acts { display: flex; gap: .9rem; flex-wrap: wrap; }

/* check-list */
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .9rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.task input { width: 1rem; height: 1rem; accent-color: var(--accent); }
.task.done .tt { text-decoration: line-through; color: var(--muted); }
.task .meta { text-align: right; font-size: var(--fs-s); color: var(--muted); white-space: nowrap; }

/* phone and map */
.duo { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 1.8rem; align-items: start; }
@media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }
.phone { border: 1px solid var(--line-strong); border-radius: 1.6rem; padding: .9rem; background: var(--bg); display: grid; gap: .55rem; }
.bub { background: var(--raised); border-radius: .75rem; padding: .5rem .7rem; font-size: var(--fs-s); }
.bub.me { background: transparent; border: 1px solid var(--line-strong); justify-self: end; }
.bub .w { font-size: var(--fs-s); color: var(--muted); display: block; }
.share { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .1rem .2rem .5rem; border-bottom: 1px solid var(--line); font-size: var(--fs-s); }

.mapbox { position: relative; width: 100%; max-width: calc(var(--ar, 2) * 32vh); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }

@media (max-width: 700px) {

.fade { animation: fade .3s ease both; }

        road("M0 58 C 160 70, 330 52, 600 40") + road("M262 -5 C 255 90, 272 180, 262 280") + road("M410 -5 C 420 100, 402 190, 412 280") +
        road(MAP_PATHS.rRiv, "rRiv") + road(MAP_PATHS.rV01, "rV01") +
        '<path id="rRS" d="' + MAP_PATHS.rRS + '" fill="none" stroke="var(--map-road)" stroke-width="4" stroke-linecap="round"></path>' +
        '<path id="rExp" d="' + MAP_PATHS.rExp + '" fill="none" stroke="var(--map-exp)" stroke-width="8" stroke-linecap="round"></path>' +
        (o.jam ? '<path id="rJam" d="' + MAP_PATHS.rExp + '" fill="none" stroke="var(--crit)" stroke-width="8" stroke-linecap="round"></path>' : '') +
        '<path id="rRoute" d="' + MAP_PATHS[o.route] + '" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 3000"></path>' +
        '<g transform="translate(566 150) rotate(-18)"><rect x="-34" y="-17" width="68" height="6" rx="2" fill="var(--map-exp)"></rect><rect x="-34" y="11" width="68" height="6" rx="2" fill="var(--map-exp)"></rect><rect x="-14" y="-6" width="28" height="12" rx="3" fill="var(--text)"></rect></g>' +
        '<rect x="159" y="89" width="12" height="12" rx="2" fill="var(--text)"></rect><rect x="129" y="216" width="12" height="12" rx="2" fill="var(--text)"></rect>' +
        o.cars.filter(function (c) { return !c.main; }).map(car).join("") + o.cars.filter(function (c) { return c.main; }).map(car).join("") +
      '</svg>' +
      lab(165, 95, "Lumière Bangkok", "place t") + lab(135, 222, "Riverside Suites", "place b") + lab(566, 160, "BKK", "place b keep") +
      o.cars.filter(function (c) { return c.lab; }).map(function (c) { return '<span class="mlab car' + (c.main ? '' : ' amb') + '" id="' + c.id + 'L">' + c.lab + '</span>'; }).join("") +
      '<span class="live"><i></i>Live · ' + o.time + '</span>' + (o.chip ? '<span class="mchip">' + o.chip + '</span>' : '') +
    '</div>';
  }
  function liveMap(o) {
    var svg = $(".map"); if (!svg || !document.getElementById("rExp")) return;
    if (S._mapRaf) cancelAnimationFrame(S._mapRaf);
    var reduce = false; try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    var vb = o.vb, P = {};
    var path = function (id) { if (!P[id]) { var el = document.getElementById(id); P[id] = { p: el, L: el.getTotalLength() }; } return P[id]; };
    var at = function (r, f, flip) {
      f = Math.max(0, Math.min(1, f));
      var d = f * r.L, a = r.p.getPointAtLength(Math.max(0, d - 1)), b = r.p.getPointAtLength(Math.min(r.L, d + 1)), c = r.p.getPointAtLength(d);
      return { x: c.x, y: c.y, a: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + (flip ? 180 : 0) };
    };
    var put = function (id, pt, op, big) {
      var g = document.getElementById(id), l = document.getElementById(id + "L"), fx = (pt.x - vb[0]) / vb[2];
      if (g) { g.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ") rotate(" + pt.a.toFixed(1) + ") scale(" + (big ? 1.5 : 1.3) + ")"); g.style.opacity = op; }
      if (l) { l.style.left = (fx * 100) + "%"; l.style.top = ((pt.y - vb[1]) / vb[3] * 100) + "%"; l.style.opacity = op; l.style.setProperty("--ax", "-" + (8 + Math.max(0, Math.min(1, fx)) * 84).toFixed(1) + "%"); }
    };
    S._amb = S._amb || {}; S._mf = S._mf || {};
    var m = o.main, mr = path(m.path), L = mr.L;
    var from = m.off || S._mf[m.id] === undefined || Math.abs(S._mf[m.id] - m.to) < .005 ? undefined : S._mf[m.id];
    if (m.off) delete S._mf[m.id];
    var jam = document.getElementById("rJam"), route = document.getElementById("rRoute");
    if (jam && o.jam) { var J = path("rExp").L; jam.style.strokeDasharray = "0 " + (o.jam[0] * J) + " " + ((o.jam[1] - o.jam[0]) * J) + " " + J; }
    var t0 = performance.now(), last = t0;
    function frame(now) {
      if (!svg.isConnected) return;
      var dt = Math.min(.1, (now - last) / 1000); last = now;
      (o.amb || []).forEach(function (c) {
        var f = S._amb[c.id] === undefined ? c.f : S._amb[c.id];
        if (!reduce) { f += c.v * dt; if (f > 1) f -= 1; if (f < 0) f += 1; }
        S._amb[c.id] = f;
        put(c.id, at(path(c.path), f, c.flip), Math.max(0, Math.min(1, f / .04, (1 - f) / .04)), false);
      });
      var e = (now - t0) / 1000, f;
      if (reduce) f = m.to;
      else if (from !== undefined && e < 1.2) { var k = e / 1.2; k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; f = from + (m.to - from) * k; }
      else f = m.to + m.drift * Math.min(1, Math.max(0, e - (from !== undefined ? 1.2 : 0)) / 45);
      if (!m.off) S._mf[m.id] = f;
      put(m.id, at(mr, f, m.flip), 1, true);
      if (route) route.style.strokeDasharray = m.route === "ahead" ? "0 " + (f * L) + " " + ((1 - f) * L) + " " + L : m.route === "behind" ? (f * L) + " " + L : "0 " + L;
      if (!reduce) S._mapRaf = requestAnimationFrame(frame);
    }
    frame(t0);
  }

  function wire(sc) {
    var on = function (id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; };
    on("prev", function () { step(-1); });
    on("next", function () { step(1); });
    on("homeBtn", restart);
    $$("[data-mod]").forEach(function (b) { b.onclick = function () { go(+b.getAttribute("data-mod")); }; });
    on("notesBtn", function () { S.notes = !S.notes; render(); });
    on("notesClose", function () { S.notes = false; render(); });
    if (sc.wire) sc.wire();
  }
  function toggleFs() { try { if (!document.fullscreenElement) root.requestFullscreen(); else document.exitFullscreen(); } catch (e) {} }
  function step(d) { var q = seq(), k = Math.max(0, q.indexOf(S.i)); go(q[Math.max(0, Math.min(q.length - 1, k + d))]); }
  // Back to the first screen with every scene as new. The side, the profile and the priorities are kept.
  function restart() {
    S.imp = 0; S.transfers = JSON.parse(JSON.stringify(TRANSFERS0)); S.pick = null; S.lastAssign = null; S.freeAt = "16:00";
    S.owner = "all"; S.tasksDone = {}; S.signal = "all"; S.reasons = {}; S.blocking = null;
    S.cards = { AU01: "confirmed", ES01: "confirmed", CN01: "confirmed", SG01: "confirmed", JP01: "confirmed", TH01: "progress", HK01: "progress", KR01: "todo", AE01: "todo" };
    S.delay = 0; S.drv = 0; S.drvAlert = 0; S.drvNight = false; S.loc = false; S.choice = null; S._mf = {}; S.tab = "costs";
    S.mD = 0; S.mAppr = { dinner: "proposed", temple: "proposed", gift: "proposed" }; S.mCh = "flight";
    S.mT = 0; S.mTab = "markets"; S.mClose = 0;
    go(0);
  }
  function go(i) {
    S.i = Math.max(0, Math.min(SCENES.length - 1, i));
    var id = SCENES[S.i].id;
    if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
    render();
    window.scrollTo(0, 0);
  }
  function fromHash() {
    var id = (location.hash || "").replace("#", "");
    var k = SCENES.findIndex(function (s) { return s.id === id; });
    S.i = k >= 0 ? k : 0;
    var sd = sideOf(SCENES[S.i]);
    if (sd && sd !== S.side) { S.side = sd; S.profile = "all"; }
    if (seq().indexOf(S.i) < 0) S.profile = "all";
    render();
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") step(1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") step(-1);
    else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; render(); }
    else if (e.key === "Escape" && S.notes) { S.notes = false; render(); }
    else if (e.key === "f" || e.key === "F") toggleFs();
    else if (e.key === "Home") restart();
  });
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
