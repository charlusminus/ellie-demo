<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ellie for a DMC: a day of transport, from the brief to the review.">
<title>Ellie for DMCs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Jost:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spectral:wght@300;400&display=swap">
<style>
/* Three looks for the same demo, each with a dark and a light theme. A banner on the first screen lets the viewer pick one;
   ?look=a|b|c fixes the look and hides the banner (the link to use in a meeting).
   Layout: built for a projector. The story on the left, a live Ellie screen on the right, one counter at the bottom.
   No cards inside the screen: sections are separated by space and hairlines. One status marker per scene, in the screen bar. */

/* ---------- Look A, "Maison de nuit": night blue, ivory, gold kept for the one filled button. Didone titles.
   The light theme never darkens the gold (it turns brown): it writes in night blue and keeps the bright gold as a fill. */
:root[data-look="a"] {
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: var(--f-body); --f-kpi: var(--f-display);
  --title-w: 500; --title-ls: -0.012em; --title-lh: 1.08; --title-1: 3.3rem; --title-2: 2.9rem; --title-opsz: 18;
  --nav-tt: uppercase; --nav-ls: .14em; --nav-size: .68rem;
  --radius: 2px; --radius-lg: 4px;
  --brand-font: var(--f-display); --brand-ls: .36em; --brand-w: 500; --brand-size: 1.3rem;
}
:root[data-look="a"][data-theme="dark"] {
  --bg: #070d1a; --surface: #0c1628; --raised: #132240;
  --text: #ece6d8; --muted: #9ea8bb; --line: rgba(236, 230, 216, .13); --line-strong: #62708a;
  --accent: #cfab63; --btn-bg: #cfab63; --btn-ink: #0a0f1a;
  --ok: #86c7a0; --warn: #e0b25a; --crit: #e89482; --soon: #a3b6ea;
}
:root[data-look="a"][data-theme="light"] {
  --bg: #f6f3ec; --surface: #ffffff; --raised: #f1ede4;
  --text: #0b1930; --muted: #586478; --line: rgba(11, 25, 48, .12); --line-strong: #848d9e;
  --accent: #0b1930; --btn-bg: #cfab63; --btn-ink: #0b1930;
  --ok: #2e6b4f; --warn: #a84d06; --crit: #b3261e; --soon: #3d5a96;
}

/* ---------- Look B, "Vert-de-gris": warm black, the patina of bronze, ivory. One grotesque, mono figures, square corners. */
:root[data-look="b"] {
  --f-display: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace; --f-kpi: var(--f-num);
  --title-w: 600; --title-ls: -0.035em; --title-lh: 1.02; --title-1: 3.4rem; --title-2: 3rem;
  --nav-tt: none; --nav-ls: 0; --nav-size: .86rem;
  --radius: 0px; --radius-lg: 0px;
  --brand-font: var(--f-body); --brand-ls: .26em; --brand-w: 700; --brand-size: 1rem;
}
:root[data-look="b"][data-theme="dark"] {
  --bg: #0c0e0d; --surface: #131715; --raised: #1c2320;
  --text: #e9e7e0; --muted: #9ba49e; --line: rgba(233, 231, 224, .12); --line-strong: #66716b;
  --accent: #8ecbb5; --btn-bg: #8ecbb5; --btn-ink: #08110e;
  --ok: #8ecbb5; --warn: #e2b35c; --crit: #ee9683; --soon: #adb7ee;
}
:root[data-look="b"][data-theme="light"] {
  --bg: #f3f3ef; --surface: #ffffff; --raised: #ecece6;
  --text: #111614; --muted: #57605a; --line: rgba(17, 22, 20, .12); --line-strong: #808983;
  --accent: #1d6a56; --btn-bg: #111614; --btn-ink: #f3f3ef;
  --ok: #1d6a56; --warn: #8a6212; --crit: #a8412f; --soon: #4353a6;
}

/* ---------- Look C, "Terre et bronze": espresso and sand, no accent colour, only the statuses carry colour. Light serif titles. */
:root[data-look="c"] {
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: var(--f-body); --f-kpi: var(--f-display);
  --title-w: 300; --title-ls: -0.02em; --title-lh: 1.08; --title-1: 3.5rem; --title-2: 3.1rem;
  --nav-tt: none; --nav-ls: .01em; --nav-size: .9rem;
  --radius: 4px; --radius-lg: 6px;
  --brand-font: var(--f-display); --brand-ls: .42em; --brand-w: 300; --brand-size: 1.25rem;
}
:root[data-look="c"][data-theme="dark"] {
  --bg: #15120f; --surface: #1d1915; --raised: #2a241d;
  --text: #ede5d7; --muted: #aba293; --line: rgba(237, 229, 215, .12); --line-strong: #766c60;
  --accent: #ede5d7; --btn-bg: #ede5d7; --btn-ink: #15120f;
  --ok: #a9c492; --warn: #e0b560; --crit: #ec9785; --soon: #a9bbdb;
}
:root[data-look="c"][data-theme="light"] {
  --bg: #f2ede4; --surface: #fbf8f2; --raised: #ebe4d8;
  --text: #1e1914; --muted: #675e53; --line: rgba(30, 25, 20, .12); --line-strong: #8e8477;
  --accent: #1e1914; --btn-bg: #1e1914; --btn-ink: #f6f1e8;
  --ok: #3f6634; --warn: #7f5a0c; --crit: #a2402f; --soon: #3f5c8f;
}

/* Contrast, measured on the worst ground of each look and theme (design/contrast.py): text and statuses at 4.5 or more,
   control borders (--line-strong) at 3.0 or more. Exception: --line is a decorative hairline between rows, about 1.3 to 1,
   never the only cue for a control or a state. */
/* Derived tints: the same recipe for every look and theme. */
:root {
  --wash: color-mix(in srgb, var(--accent) 9%, transparent);
  --grid: color-mix(in srgb, var(--text) 6%, transparent);
  --win-bg: color-mix(in srgb, var(--text) 9%, var(--surface));
  --vip-bg: color-mix(in srgb, var(--accent) 22%, var(--surface));
  --other: color-mix(in srgb, var(--crit) 45%, transparent);
  --bad-bg: color-mix(in srgb, var(--crit) 16%, var(--surface));
  --river: color-mix(in srgb, var(--soon) 26%, var(--surface));
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html { font-size: clamp(14px, 0.55vw + 8.5px, 21px); }
html, body { background: var(--bg); color: var(--text); margin: 0; }
body { font-family: var(--f-body); line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input { font: inherit; color: var(--text); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.2rem;
  padding: env(safe-area-inset-top, 0px) max(1.6rem, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(1.6rem, env(safe-area-inset-left, 0px)); }
@media (min-width: 1100px) and (min-height: 640px) { .app { height: 100vh; } }
@media (max-width: 700px) { .app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* shared text styles */
.label { font-size: .8rem; font-weight: 500; color: var(--muted); }
.mods .label, .who { font-size: var(--nav-size); letter-spacing: var(--nav-ls); text-transform: var(--nav-tt); }
.s { color: var(--muted); font-size: .84rem; }
.t { font-weight: 500; }
.code { font-family: var(--f-num); font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.tn { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* look picker, first screen only */
.pick { display: flex; align-items: baseline; gap: .4rem 1.8rem; flex-wrap: wrap; padding: .75rem 0 .7rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
.pick .q { font-weight: 500; }
.pick .looks { display: flex; gap: .3rem 1.6rem; flex-wrap: wrap; }
.pick .looks button { padding: .1rem 0 .2rem; color: var(--muted); border-bottom: 2px solid transparent; }
.pick .looks button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
.pick .hint { margin-left: auto; color: var(--muted); font-size: .8rem; display: flex; gap: 1.2rem; }

/* header */
.hdr { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem 2rem; flex-wrap: wrap; padding-top: 1.1rem; }
.brand { font-family: var(--brand-font); font-size: var(--brand-size); letter-spacing: var(--brand-ls); font-weight: var(--brand-w); font-variation-settings: "opsz" var(--title-opsz, 14); }
.evt { color: var(--muted); font-size: .86rem; margin-left: 1.2rem; }
.mods { display: flex; gap: 1.8rem; }
.mods button { padding: .25rem 0; border-bottom: 1px solid transparent; }
.mods button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tools { display: flex; gap: 1.1rem; opacity: 0; transition: opacity .2s; }
.hdr:hover .tools, .tools:focus-within { opacity: 1; }
@media (hover: none) { .tools { opacity: 1; } }
.tools button { font-size: .76rem; color: var(--muted); }
.tools button:hover, .tools button[aria-pressed="true"] { color: var(--text); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 34fr) minmax(0, 66fr); gap: 2.6rem; min-height: 0; }
@media (max-width: 1099px) { .stage { grid-template-columns: 1fr; gap: 1.6rem; } }
.story { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; overflow-y: auto; padding: .8rem .2rem .2rem 0; }
.who b { color: var(--text); font-weight: 500; }
h1, h2 { font-family: var(--f-display); font-weight: var(--title-w); letter-spacing: var(--title-ls); line-height: var(--title-lh); margin: 0; text-wrap: balance; font-variation-settings: "opsz" var(--title-opsz, 14); }
h1 { font-size: var(--title-1); }
h2 { font-size: var(--title-2); }
.lede { color: var(--muted); font-size: 1.15rem; max-width: 40ch; margin: 0; }
.ba { margin: .3rem 0 0; }
.ba > div { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--line); }
.ba dt { padding-top: .22rem; }
.ba dd { margin: 0; color: var(--muted); font-size: 1.05rem; }
.ba .after dd { color: var(--text); }
.priv { margin: 0; font-size: .84rem; color: var(--muted); }
.notes { border-top: 1px dashed var(--line-strong); padding-top: .8rem; display: grid; gap: .4rem; font-size: .84rem; color: var(--muted); }
.notes b { color: var(--text); font-weight: 500; }
.nav { display: flex; gap: .6rem; margin-top: auto; padding-top: .4rem; }

.btn { border-radius: var(--radius); padding: .55rem 1.2rem; border: 1px solid var(--line-strong); font-size: .9rem; }
.btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); font-weight: 600; }
.btn.sm { padding: .26rem .75rem; font-size: .8rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { font-size: .8rem; color: var(--muted); text-decoration: underline; text-underline-offset: .22em; }
.link:hover { color: var(--text); }

/* the Ellie screen */
.screen { background: var(--surface); border-radius: var(--radius-lg); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; max-height: 100%; align-self: start; overflow: hidden; }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1.2rem 1.6rem 0; flex-wrap: wrap; }
.state { font-size: .78rem; }
.sbody { padding: 1rem 1.6rem 1.5rem; overflow-y: auto; display: grid; gap: 1rem; align-content: start; min-height: 0; }
.sec { display: grid; gap: 0; align-content: start; min-width: 0; }
.sec > .label { padding-bottom: .45rem; border-bottom: 1px solid var(--line); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2rem; }
@media (max-width: 700px) { .cols2 { grid-template-columns: 1fr; gap: 1.2rem; } }

.line { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); }
.line .l { display: grid; gap: .1rem; min-width: 0; }
.line.sel { background: var(--wash); box-shadow: -.6rem 0 0 var(--wash), .6rem 0 0 var(--wash); }
.prow { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) auto; gap: 1rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--line); }

/* one status style: a coloured word */
.st { font-size: .8rem; white-space: nowrap; color: var(--muted); }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.crit { color: var(--crit); } .st.soon { color: var(--soon); }
.crit { color: var(--crit); } .ok { color: var(--ok); } .warn { color: var(--warn); }

.tabs { display: flex; gap: 1.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { padding: .3rem 0 .45rem; font-size: .88rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .c { font-family: var(--f-num); font-size: .78rem; margin-left: .4rem; }

.note { margin: 0; border-left: 2px solid var(--line-strong); padding: .15rem 0 .15rem .85rem; font-size: .9rem; }
.note.ok { border-color: var(--ok); } .note.warn { border-color: var(--warn); } .note.crit { border-color: var(--crit); }
.sum { margin: 0; font-size: .9rem; color: var(--muted); }
.alert { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.alert b { font-size: 1.45rem; font-weight: 500; letter-spacing: -.01em; }
.t > span + span { margin-left: .7rem; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 1.6rem; }
.kpi { display: grid; gap: .1rem; }
.kpi b { font-variation-settings: "opsz" var(--title-opsz, 14); font-family: var(--f-kpi); font-weight: var(--title-w); font-size: 2.3rem; line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; letter-spacing: var(--title-ls); }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: .55rem .8rem .55rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; }
td.num, th.num { text-align: right; padding-right: 0; font-family: var(--f-num); white-space: nowrap; }
.frame td:first-child { font-weight: 500; white-space: nowrap; }
.frame tr { cursor: pointer; }
.frame tr.sel td { background: var(--wash); }
.frame td:not(:first-child) { color: var(--muted); }
.frame tr.sel td { color: var(--text); }

.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 1.2rem; }
.team button { display: grid; gap: .1rem; text-align: left; align-content: start; padding: .65rem 0 0; border-top: 1px solid var(--line-strong); }
.team button[aria-pressed="true"] { border-top: 2px solid var(--accent); padding-top: calc(.65rem - 1px); }
.mods button[disabled] { opacity: .35; cursor: default; }

/* transport plan */
.gantt { display: grid; gap: .22rem; }
.g-head, .g-row { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: .6rem; align-items: center; }
.g-hours { position: relative; height: 1.1rem; }
.g-hours span { position: absolute; transform: translateX(-50%); font-family: var(--f-num); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.g-hours .g-nowlab { color: var(--text); font-weight: 600; background: var(--surface); padding: 0 .3rem; z-index: 1; }
.g-lab { font-size: .92rem; white-space: nowrap; }
.g-track { position: relative; height: 2.25rem; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100%/18 - 1px), var(--grid) calc(100%/18 - 1px), var(--grid) calc(100%/18)); border-bottom: 1px solid var(--line); }
.g-win { position: absolute; top: 0; bottom: 0; background: var(--win-bg); border-left: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }
.g-other { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--other) 0 5px, transparent 5px 10px); }
.g-blk { position: absolute; top: .3rem; height: 1.65rem; min-width: max-content; border-radius: min(var(--radius), 3px); background: var(--raised); border: 1px solid var(--line-strong); font-family: var(--f-num); font-size: .8rem; font-weight: 500; padding: 0 .45rem; display: flex; align-items: center; white-space: nowrap; }
.g-blk.none { background: var(--bad-bg); border-color: var(--crit); color: var(--crit); }
.g-row.nocar .g-track { background: none; }
.g-row.nocar .g-lab { color: var(--crit); font-weight: 500; }
.g-blk.vip { background: var(--vip-bg); border-color: var(--accent); }
.g-blk.new { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); font-weight: 600; }
.g-blk.bad { border-color: var(--crit); background: var(--bad-bg); }
.g-now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text); }
.legend { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
.legend i { display: inline-block; width: .9rem; height: .55rem; margin-right: .4rem; vertical-align: middle; }
.stepper { display: inline-flex; align-items: baseline; gap: .5rem; margin-left: .4rem; }
.stepper b { font-family: var(--f-num); font-size: 1.1rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.stepper button { width: 1.5rem; color: var(--muted); font-size: 1.05rem; }
.stepper button:hover { color: var(--text); }
.link.strong { color: var(--text); }

/* board */
.kan { display: grid; grid-template-columns: repeat(4, minmax(8.5rem, 1fr)); gap: 1.6rem; overflow-x: auto; }
.kcard { padding: .6rem 0; border-bottom: 1px solid var(--line); display: grid; gap: .25rem; }
.kcard.blocked { box-shadow: inset 2px 0 0 var(--crit); padding-left: .7rem; }
.acts { display: flex; gap: .9rem; flex-wrap: wrap; }

/* check-list */
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .9rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.task input { width: 1rem; height: 1rem; accent-color: var(--accent); }
.task.done .tt { text-decoration: line-through; color: var(--muted); }
.task .meta { text-align: right; font-size: .78rem; color: var(--muted); white-space: nowrap; }

/* phone and map */
.duo { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 1.8rem; align-items: start; }
@media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }
.phone { border: 1px solid var(--line-strong); border-radius: 1.6rem; padding: .9rem; background: var(--bg); display: grid; gap: .55rem; }
.bub { background: var(--raised); border-radius: .75rem; padding: .5rem .7rem; font-size: .8rem; }
.bub.me { background: transparent; border: 1px solid var(--line-strong); justify-self: end; }
.bub .w { font-size: .66rem; color: var(--muted); display: block; }
.share { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .1rem .2rem .5rem; border-bottom: 1px solid var(--line); font-size: .8rem; }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
.stat button { border: 1px solid var(--line-strong); border-radius: .6rem; padding: .45rem; font-size: .78rem; }
.stat button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
.sw { width: 2.4rem; height: 1.35rem; border-radius: 999px; background: var(--raised); border: 1px solid var(--line-strong); position: relative; flex: 0 0 auto; }
.sw::after { content: ""; position: absolute; top: .12rem; left: .12rem; width: .95rem; height: .95rem; border-radius: 50%; background: var(--muted); transition: left .2s; }
.sw[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.sw[aria-checked="true"]::after { left: 1.25rem; background: var(--surface); }
.map { width: 100%; height: auto; display: block; }
.side { display: grid; gap: .9rem; align-content: start; min-width: 0; }
.mapcar { transition: transform .8s ease; }

/* review */
.bars { display: grid; gap: .4rem; }
.bl { display: grid; grid-template-columns: 3rem minmax(0, 1fr) 3.4rem; gap: .8rem; align-items: center; font-size: .8rem; }
.bl .tr { height: .5rem; background: var(--grid); overflow: hidden; }
.bl .f { display: block; height: 100%; background: var(--text); }
.bl .f.hot { background: var(--crit); }
.bl .v { text-align: right; color: var(--muted); }
.progress { height: .35rem; background: var(--grid); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .5s ease; }

/* co-design priorities */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2.2rem; }

  // The screens of the presentation: all of them, or the first, one person's screens and the last.
  function seq() { var out = []; SCENES.forEach(function (s, i) { if (!s.p || S.profile === "all" || s.p === S.profile) out.push(i); }); return out; }
  function impactUpTo(i) {
    var t = { hours: 0, messages: 0, calls: 0, caught: 0 };
    seq().forEach(function (k) { var m = SCENES[k].impact; if (k <= i && m) for (var x in t) t[x] += m[x]; });
    return t;
  }
  function render() {
    var sc = SCENES[S.i], imp = impactUpTo(S.i), q = seq(), pos = q.indexOf(S.i);
    var who = PROFILES.filter(function (p) { return p[0] === S.profile; })[0];
    var html = '' +
      '<div class="top">' +
      (S.i === 0 && S.pickBar ? '<div class="pick" role="group" aria-label="Choose a look"><span class="q">Three looks for this demo. Which one do you prefer?</span><span class="looks">' + LOOKS.map(function (l) { return '<button data-look="' + l[0] + '" aria-pressed="' + (S.look === l[0]) + '">' + l[1] + '. ' + l[2] + '</button>'; }).join("") + '</span><span class="hint"><span>Keys 1, 2, 3 switch at any time</span><button class="link" id="pickHide">Hide</button></span></div>' : '') +
      '<header class="hdr">' +
        '<div><button class="brand" id="homeBtn" title="Back to the start">ELLIE</button><span class="evt">Private Viewing Bangkok, with ' + esc(DMC) + '</span></div>' +
        '<nav class="mods" aria-label="Modules">' + MODS.map(function (m) {
          var first = q.filter(function (k) { return SCENES[k].mod === m[0]; })[0];
          return '<button class="label" ' + (first === undefined ? 'disabled' : 'data-mod="' + first + '"') + ' aria-current="' + (sc.mod === m[0]) + '">' + m[1] + '</button>';
        }).join("") + '</nav>' +
        '<div class="tools">' +
          '<button id="themeBtn" title="Switch theme (T)">' + (S.theme === "dark" ? "Light" : "Dark") + '</button><button id="notesBtn" aria-pressed="' + S.notes + '" title="Presenter notes (N)">Notes</button><button id="fsBtn" title="Full screen (F)">Full screen</button></div>' +
      '</header></div>' +
      '<div class="stage">' +
        '<section class="story" aria-live="polite">' +
          '<div class="label who">' + sc.who + '</div>' +
          (S.i === 0 ? '<h1>' + sc.title + '</h1>' : '<h2>' + sc.title + '</h2>') +
          '<p class="lede">' + sc.lede + '</p>' +
          (sc.privacy ? '<p class="priv">' + sc.privacy + '</p>' : '') +
          (sc.before ? '<dl class="ba"><div><dt class="label">Today</dt><dd>' + sc.before + '</dd></div><div class="after"><dt class="label">With Ellie</dt><dd>' + sc.after + '</dd></div></dl>' : '') +
          (S.notes ? '<div class="notes">' + (sc.notes.say ? '<span><b>Say.</b> ' + sc.notes.say + '</span>' : '') + (sc.notes.live ? '<span><b>Show it live in Ellie.</b> ' + sc.notes.live + '</span>' : (sc.status === "soon" ? '<span><b>Not in Ellie yet.</b> Present it as a proposal to design together.</span>' : '')) + (sc.notes.ask ? '<span><b>Ask.</b> ' + sc.notes.ask + '</span>' : '') + '<span>Keys: arrows to move, N notes, T theme, 1 2 3 looks, F full screen. Click ELLIE to start over.</span></div>' : '') +
          '<div class="nav">' + (pos > 0 ? '<button class="btn" id="prev">Back</button>' : '') + (pos < q.length - 1 ? '<button class="btn primary" id="next">' + (S.i === 0 ? (who ? "Follow " + who[1] : "Start with the brief") : "Next") + '</button>' : '') + '</div>' +
        '</section>' +
        '<section class="screen" aria-label="Ellie screen">' +
          '<div class="bar"><span class="label">' + sc.where + '</span>' + (sc.status === "today" ? '<span class="state st ok">In Ellie today</span>' : sc.status === "soon" ? '<span class="state st soon">In co-design</span>' : '') + '</div>' +
          '<div class="sbody" id="sbody">' + sc.screen() + '</div>' +
        '</section>' +
      '</div>' +
      '<div class="meter" role="status" aria-label="Given back to your team so far"><span class="label">' + (who ? "Given back in " + who[1] + "'s day" : "Given back to your team") + '</span><span><b>' + imp.hours + '</b><span class="u">hours</span></span><span><b>' + imp.calls + '</b><span class="u">calls not made</span></span><span><b>' + imp.messages + '</b><span class="u">messages not sent</span></span><span><b>' + imp.caught + '</b><span class="u">problems seen early</span></span><span class="ill">Illustrative figures, fictional data</span></div>';
    var sb = $("#sbody"), keep = sb ? sb.scrollTop : 0, same = render.last === S.i;
    $("#app").innerHTML = html;
    if (same) $("#sbody").scrollTop = keep;
    render.last = S.i;
    wire(sc);
  }
  function wire(sc) {
    var on = function (id, fn) { var e = document.getElementById(id); if (e) e.onclick = fn; };
    on("prev", function () { step(-1); });
    on("next", function () { step(1); });
    on("homeBtn", restart);
    on("notesBtn", function () { S.notes = !S.notes; render(); });
    on("themeBtn", toggleTheme);
    on("fsBtn", toggleFs);
    $$("[data-mod]").forEach(function (b) { b.onclick = function () { go(+b.getAttribute("data-mod")); }; });
    $$("[data-look]").forEach(function (b) { b.onclick = function () { setLook(b.getAttribute("data-look")); }; });
    on("pickHide", function () { S.pickBar = false; try { sessionStorage.setItem("ellie-demo-pick-hidden", "1"); } catch (e) {} render(); });
    if (sc.wire) sc.wire();
  }
  function setLook(l) { S.look = l; root.setAttribute("data-look", l); try { localStorage.setItem("ellie-demo-look", l); } catch (e) {} render(); }
  function toggleTheme() { S.theme = S.theme === "dark" ? "light" : "dark"; root.setAttribute("data-theme", S.theme); try { localStorage.setItem("ellie-demo-theme", S.theme); } catch (e) {} render(); }
  function toggleFs() { try { if (!document.fullscreenElement) root.requestFullscreen(); else document.exitFullscreen(); } catch (e) {} }
  function step(d) { var q = seq(), k = Math.max(0, q.indexOf(S.i)); go(q[Math.max(0, Math.min(q.length - 1, k + d))]); }
  // Back to the first screen with every scene as new. The look, the theme, the profile and the co-design priorities are kept.
  function restart() {
    S.imp = 0; S.transfers = JSON.parse(JSON.stringify(TRANSFERS0)); S.pick = null; S.lastAssign = null; S.freeAt = "16:00";
    S.owner = "all"; S.tasksDone = {}; S.signal = "all"; S.reasons = {}; S.blocking = null;
    S.cards = { AU01: "confirmed", ES01: "confirmed", CN01: "confirmed", SG01: "confirmed", JP01: "confirmed", TH01: "progress", HK01: "progress", KR01: "todo", AE01: "todo" };
    S.delay = 0; S.drv = 0; S.drvAlert = 0; S.drvNight = false; S.loc = false; S.choice = null; S.tab = "transport";
    go(0);
  }
  function go(i) {
    S.i = Math.max(0, Math.min(SCENES.length - 1, i));
    var id = SCENES[S.i].id;
    if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
    render();
    window.scrollTo(0, 0);
  }
  function fromHash() {
    var id = (location.hash || "").replace("#", "");
    var k = SCENES.findIndex(function (s) { return s.id === id; });
    S.i = k >= 0 ? k : 0;
    if (seq().indexOf(S.i) < 0) S.profile = "all";
    render();
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") step(1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") step(-1);
    else if (e.key === "n" || e.key === "N") { S.notes = !S.notes; render(); }
    else if (e.key === "f" || e.key === "F") toggleFs();
    else if (e.key === "t" || e.key === "T") toggleTheme();
    else if (e.key === "1" || e.key === "2" || e.key === "3") setLook(["a", "b", "c"][+e.key - 1]);
    else if (e.key === "Home") restart();
  });
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
