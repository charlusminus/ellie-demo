<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ellie: one guest's journey in Bangkok, and the invisible work behind it.">
<title>Ellie, a guest's journey</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Mulish:wght@400;500;600&display=swap">
<style>
/* Ellie, a guest's journey. A short version of the demo for a DMC: six screens, one idea each.
   Charter: Cormorant Garamond and Mulish, night blue, ivory, one gold. One text scale, nothing under 14 px.
   Desktop: everything fits the window, no scrolling. Phone: title, text, screen, navigation fixed at the bottom. */
:root {
  --bg: #051022; --panel: #0b2447; --raised: #13305a;
  --text: #f7f3ea; --muted: #c2bcaf; --gold: #d8b873; --ink: #0b1a33;
  --alert: #e09a8a; --ok: #86c7a0; --line: #2a4470; --ctl: #8f897c;
  --f-title: "Cormorant Garamond", "Cormorant", Georgia, serif;
  --f-text: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s: .875rem; --b: 1rem; --l: 1.125rem; --h3: 1.375rem; --h1: 2.7rem; --h0: 3.5rem;
  --map-bg: #06142b; --map-street: rgba(247, 243, 234, .06); --map-road: #1b2a45; --map-exp: #36435b;
  --map-park: #0f2a30; --river: #173a63;
  /* the driver's phone: a light chat, as most people know it */
  --wa-bar: #008069; --wa-wall: #efeae2; --wa-in: #ffffff; --wa-out: #d9fdd3; --wa-ink: #111b21; --wa-meta: #54656f;
}
* { box-sizing: border-box; }
html { font-size: clamp(16px, min(1.15vw, 2vh), 28px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--b)/1.5 var(--f-text); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#bg { position: fixed; inset: 0; z-index: -1; background: var(--bg) center / cover no-repeat; opacity: 0; transition: opacity .6s ease; }
#bg.is-split { opacity: .13; } #bg.is-cover { opacity: .2; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.4rem 4rem 0; }
.brand { display: inline-flex; color: var(--gold); padding: .4rem 0; }
.brand svg { height: 1rem; width: auto; display: block; }
.sign { font-size: var(--s); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

.eyebrow { margin: 0; font-size: var(--s); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: .5rem; color: var(--text); letter-spacing: .12em; }
.tag::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--gold); }
h1 { margin: 0; font: 400 var(--h1)/1.1 var(--f-title); letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: italic; color: var(--gold); }
.lede { margin: 0; font-size: var(--l); color: var(--muted); max-width: 34rem; text-wrap: pretty; }
.rule { margin: 0; padding-left: 1rem; border-left: 1px solid var(--gold); color: var(--text); max-width: 30rem; }

main { min-height: 0; padding: 0 4rem; }
.split { height: 100%; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 4rem; align-items: center; }
.story { display: grid; gap: 1.4rem; align-content: center; }
.screen { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cover { height: 100%; display: grid; align-content: center; justify-items: start; gap: 1.6rem; max-width: 62rem; }
.cover h1 { font-size: var(--h0); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 4rem 1.4rem; }
.count { font-size: var(--s); color: var(--muted); letter-spacing: .08em; }
.count b { color: var(--text); font-weight: 600; }
.navb { display: flex; gap: .75rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0 1.5rem; border: 1px solid var(--ctl); border-radius: 4px; font-weight: 500; color: var(--text); transition: border-color .2s, background .2s; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
.btn.primary:hover { background: #e3c98f; }
.btn[disabled] { visibility: hidden; }

/* ---------- 1. the thread of the journey (cover) */
.thread { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); width: 100%; border-top: 1px solid var(--gold); }
.thread li { position: relative; padding: 1.1rem 1rem 0 0; display: grid; gap: .1rem; }
.thread li::before { content: ""; position: absolute; top: -.3rem; left: 0; width: .55rem; height: .55rem; border-radius: 50%; background: var(--gold); }
.thread b { font: 500 var(--h3)/1.2 var(--f-title); }
.thread span { font-size: var(--s); color: var(--muted); }

/* ---------- 2. six moments */
.moments { width: 100%; display: grid; gap: 1.1rem; }
.pills { display: flex; flex-wrap: wrap; gap: .5rem; }
.pill { min-height: 2.5rem; padding: 0 1rem; border: 1px solid var(--ctl); border-radius: 999px; font-size: var(--s); font-weight: 500; color: var(--text); }
.pill:hover { border-color: var(--text); }
.pill[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
.moment { display: grid; grid-template-columns: 13rem minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.moment .pic { background: var(--raised) center / cover no-repeat; min-height: 100%; }
.moment .body { padding: 1.5rem 1.75rem; display: grid; gap: 1rem; align-content: center; }
.moment h2 { margin: 0; font: 500 var(--h3)/1.2 var(--f-title); display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .9rem; }
.moment h2 span { font: 400 var(--s)/1.5 var(--f-text); color: var(--muted); }
.rows { display: grid; }
.rows > div { padding: .8rem 0; border-top: 1px solid var(--line); display: grid; gap: .15rem; }
.rows .k { font-size: var(--s); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
.rows .ellie .k { color: var(--gold); }
.rows p { margin: 0; }
.rows .guest p { font: 400 var(--h3)/1.3 var(--f-title); }

/* ---------- 3. the driver's phone */
.phonewrap { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: .7rem; justify-items: center; align-content: center; }
.phone { height: 100%; max-height: 37rem; width: 21rem; max-width: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); border: .45rem solid #1b2940; border-radius: 2.2rem; overflow: hidden; background: var(--wa-wall); color: var(--wa-ink); }
.wa-bar { background: var(--wa-bar); color: #fff; display: flex; align-items: center; gap: .7rem; padding: .7rem .9rem; }
.wa-bar img { width: 2.3rem; height: 2.3rem; border-radius: 50%; }
.wa-bar b { display: block; font-weight: 600; line-height: 1.25; }
.wa-bar span { display: block; font-size: var(--s); line-height: 1.3; }
.chat { overflow-y: auto; padding: .8rem .7rem 1rem; display: flex; flex-direction: column; gap: .45rem; scrollbar-width: thin; }
.day, .sys { align-self: center; background: #fff; border-radius: 6px; padding: .15rem .7rem; font-size: var(--s); color: var(--wa-meta); text-align: center; }
.sys { background: #fdf4c5; color: var(--wa-ink); max-width: 92%; }
.bub { max-width: 88%; padding: .45rem .65rem .3rem; border-radius: 8px; background: var(--wa-in); align-self: flex-start; box-shadow: 0 1px 0 rgba(11, 20, 26, .12); }
.bub.me { background: var(--wa-out); align-self: flex-end; }
.bub .t { display: block; text-align: right; font-size: var(--s); color: var(--wa-meta); line-height: 1.3; }
.bub .card { display: block; margin: .4rem 0 .2rem; padding: .45rem .6rem; border-left: 3px solid var(--wa-bar); background: #f0f2f5; border-radius: 4px; }
.bub .card small { display: block; font-size: var(--s); color: var(--wa-meta); }
.replies { align-self: flex-start; width: 88%; display: grid; gap: .35rem; }
.reply { min-height: 2.6rem; background: #fff; border: 1px solid #008069; border-radius: 8px; color: #00705c; font-weight: 600; box-shadow: 0 1px 0 rgba(11, 20, 26, .12); }
.reply:hover { background: #e7f6f2; }
.reply.alt { border-color: #8696a0; color: var(--wa-ink); font-weight: 500; }
.cap { margin: 0; font-size: var(--s); color: var(--muted); text-align: center; display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: center; justify-content: center; }
.textbtn { min-height: 2.5rem; padding: 0 1rem; border: 1px solid var(--ctl); border-radius: 4px; font-size: var(--s); font-weight: 500; }
.textbtn:hover { border-color: var(--text); }

/* ---------- 4. the coordinator's view, inside Ellie */
.win { width: 100%; max-width: calc(2 * (100vh - 9rem) * .47 + 2.5rem); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.25rem 1.1rem; display: grid; gap: .8rem; }
.win-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.win-bar .n { display: flex; align-items: center; gap: .8rem; font-size: var(--s); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.win-bar .n svg { height: .75rem; width: auto; color: var(--gold); }
.who { display: flex; align-items: center; gap: .55rem; font-size: var(--s); color: var(--muted); }
.who img, .ride img { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; }
.mapbox { position: relative; width: 100%; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.mapbox .map { display: block; width: 100%; height: auto; }
.mcar .halo { transform-box: fill-box; transform-origin: center; opacity: .35; animation: halo 1.8s ease-out infinite; }
@keyframes halo { from { transform: scale(.5); opacity: .45; } to { transform: scale(1.5); opacity: 0; } }
.mlab { position: absolute; white-space: nowrap; font-size: var(--s); line-height: 1.5; pointer-events: none; }
.mlab.place { color: var(--muted); transform: translate(-50%, 12px); }
.mlab.place.t { transform: translate(-50%, calc(-100% - 12px)); }
.mlab.car { transform: translate(var(--ax, -50%), calc(-100% - 13px)); background: var(--bg); border: 1px solid var(--ctl); border-radius: 999px; padding: .05rem .6rem; color: var(--text); }
.mlab.car.amb { color: var(--muted); border-color: var(--line); padding: 0 .45rem; transform: translate(var(--ax, -50%), 13px); }
.mlab.car .eta { margin-left: .5rem; padding-left: .5rem; border-left: 1px solid var(--ctl); color: var(--muted); }
.mlab.car .eta.alert { color: var(--alert); } .mlab.car .eta.ok { color: var(--ok); }
.live { position: absolute; top: .5rem; right: .5rem; display: flex; align-items: center; gap: .45rem; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .65rem; font-size: var(--s); }
.live i { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.under { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .5rem 1.5rem; align-items: start; }
.ride { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .1rem .7rem; align-items: center; }
.ride .l1 { font-weight: 500; } .ride .l2 { grid-column: 2; font-size: var(--s); color: var(--muted); }
.code { font-weight: 600; letter-spacing: .06em; color: var(--gold); margin-right: .5rem; }
.st { display: inline-flex; align-items: center; gap: .45rem; font-size: var(--s); font-weight: 500; }
.st::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); }
.st.ok::before { background: var(--ok); } .st.alert::before { background: var(--alert); } .st.gold::before { background: var(--gold); }
.st.alert { color: var(--alert); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; font-size: var(--s); }
.log li { display: grid; grid-template-columns: 3rem minmax(0, 1fr); color: var(--muted); }
.log li:last-child { color: var(--text); }
.log li.alert { color: var(--alert); }
.log li.k { display: block; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.win .acts { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; }
.win .acts span { font-size: var(--s); color: var(--muted); }

/* ---------- 5. who works where */
.where { width: 100%; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1.25rem; align-items: stretch; }
.box { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 1.4rem 1.5rem; display: grid; gap: 1rem; align-content: start; }
.box.gold { border-color: var(--gold); }
.box h2 { margin: 0; font-size: var(--s); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.box .p { display: grid; gap: .1rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.box .p b { font: 500 var(--h3)/1.25 var(--f-title); }
.box .p span { color: var(--muted); }
.msg { background: var(--wa-wall); border-radius: 6px; padding: .8rem; display: grid; gap: .4rem; color: var(--wa-ink); }
.msg .bub { max-width: 100%; }
.msg .ans { justify-self: end; }
.note { margin: 0; font-size: var(--s); color: var(--muted); }

/* ---------- 6. the close */
.ask { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; width: 100%; max-width: 46rem; }
.ask li { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); align-items: baseline; padding: .9rem 0; border-top: 1px solid var(--line); font-size: var(--l); }
.ask li i { font: 400 var(--h3)/1 var(--f-title); font-style: normal; color: var(--gold); }
.legend { display: grid; gap: .35rem; margin: 0; }
.legend div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1rem; }
.legend dt { font-size: var(--s); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding-top: .15rem; }
.legend dd { margin: 0; color: var(--muted); }

.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- desktop: fits the window, never scrolls */
@media (min-width: 900px) {
  html, body { height: 100%; overflow: hidden; }
  body { height: 100dvh; }
}
@media (min-width: 900px) and (max-width: 1300px) {
  .top { padding-left: 3rem; padding-right: 3rem; } main { padding: 0 3rem; } .nav { padding-left: 3rem; padding-right: 3rem; }
  .split { gap: 2.5rem; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); }
  .pill { padding: 0 .8rem; } .pills { gap: .4rem; }
  .moment { grid-template-columns: 10rem minmax(0, 1fr); }
}
@media (min-width: 900px) and (max-height: 720px) {
  .moments { gap: .8rem; } .pill { min-height: 2.25rem; }
  .rows .guest p { font-size: 1.25rem; }
  :root { --h1: 2.4rem; --h0: 3rem; }
  .top { padding-top: 1rem; } .nav { padding-top: .7rem; padding-bottom: 1rem; }
  .story { gap: 1.1rem; }
  .moment .body { padding: 1.1rem 1.5rem; gap: .6rem; } .rows > div { padding: .55rem 0; }
  .box { padding: 1.1rem 1.25rem; gap: .8rem; }
}

/* ---------- phone: title, text, screen; navigation fixed at the bottom */
@media (max-width: 899px) {
  :root { --h1: 2rem; --h0: 2.3rem; }
  .top { padding: 1rem 1.25rem 0; } .sign { display: none; }
  main { padding: 1.25rem 1.25rem 6.5rem; }
  .split { display: block; height: auto; }
  .story { gap: .9rem; margin-bottom: 1.4rem; }
  .screen { height: auto; display: block; }
  .cover { height: auto; gap: 1.2rem; padding-top: 1rem; }
  .thread { grid-template-columns: 1fr; border-top: 0; border-left: 1px solid var(--gold); margin-left: .3rem; width: auto; }
  .thread li { padding: 0 0 .9rem 1.25rem; grid-template-columns: minmax(0, 1fr) 8.5rem; align-items: baseline; }
  .thread li::before { top: .55rem; left: -.3rem; }
  .moment { grid-template-columns: 1fr; } .moment .pic { min-height: 7rem; } .moment .body { padding: 1.1rem; }
  .pill { padding: 0 .8rem; }
  .phonewrap { height: auto; } .phone { height: 33rem; width: 100%; max-width: 22rem; }
  .win { padding: .8rem; max-width: none; } .who span { display: none; }
  .under { grid-template-columns: 1fr; }
  .mlab.place:not(.keep), .mlab.car.amb { display: none; }
  .live { top: auto; right: auto; bottom: .5rem; left: .5rem; }
  .where { grid-template-columns: 1fr; }
  .ask li { grid-template-columns: 2.5rem minmax(0, 1fr); }
  .legend div { grid-template-columns: 1fr; gap: 0; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; padding: .7rem 1.25rem calc(.7rem + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .btn { padding: 0 1.2rem; }
}
@media (prefers-reduced-motion: reduce) { .mcar .halo, .live i, .fade { animation: none; } #bg { transition: none; } }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<header class="top">
  <button class="brand" id="home" title="Back to the start" aria-label="Ellie, back to the start"><svg viewBox="0 0 1013 146" fill="currentColor" aria-hidden="true" focusable="false"><rect x="0" y="0" width="130.5" height="12.5"/><rect x="0" y="0" width="12.5" height="60"/><path d="M114.5 66H30A30 30 0 0 0 0 96V146H12.5V96A17.5 17.5 0 0 1 30 78.5H114.5Z"/><rect x="0" y="133.5" width="130.5" height="12.5"/><rect x="267" y="0" width="12.5" height="146"/><rect x="267" y="133.5" width="92.5" height="12.5"/><rect x="499" y="0" width="12.5" height="146"/><rect x="499" y="133.5" width="92" height="12.5"/><rect x="737.5" y="0" width="12.5" height="146"/><rect x="905" y="0" width="12.5" height="146"/><rect x="905" y="0" width="107.5" height="12.5"/><rect x="905" y="66" width="96.5" height="12.5"/><rect x="905" y="133.5" width="107.5" height="12.5"/></svg></button>
  <span class="sign">Orchestrate the invisible</span>
</header>
<main id="app"></main>
<footer class="nav">
  <span class="count" id="count"></span>
  <span class="navb"><button class="btn" id="prev">Back</button><button class="btn primary" id="next">Next</button></span>
</footer>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  // The agency's name comes from ?dmc=Name for a meeting. The page itself names nobody.
  var DMC = "";
  try { DMC = (new URLSearchParams(location.search).get("dmc") || "").trim().slice(0, 40); } catch (e) {}

  var LOGO = '<svg viewBox="0 0 1013 146" fill="currentColor" role="img" aria-label="Ellie"><rect x="0" y="0" width="130.5" height="12.5"/><rect x="0" y="0" width="12.5" height="60"/><path d="M114.5 66H30A30 30 0 0 0 0 96V146H12.5V96A17.5 17.5 0 0 1 30 78.5H114.5Z"/><rect x="0" y="133.5" width="130.5" height="12.5"/><rect x="267" y="0" width="12.5" height="146"/><rect x="267" y="133.5" width="92.5" height="12.5"/><rect x="499" y="0" width="12.5" height="146"/><rect x="499" y="133.5" width="92" height="12.5"/><rect x="737.5" y="0" width="12.5" height="146"/><rect x="905" y="0" width="12.5" height="146"/><rect x="905" y="0" width="107.5" height="12.5"/><rect x="905" y="66" width="96.5" height="12.5"/><rect x="905" y="133.5" width="107.5" height="12.5"/></svg>';
  var CODESIGN = '<span class="tag">In co-design</span>';

  // p: how far the ride has gone, shared by the driver's phone (screen 3) and the coordinator's map (screen 4).
  // 0 ride sent · 1 confirmed · 2 position on · 3 in place (or late) · 4 guest on board · 5 dropped off
  var S = { i: 0, m: 0, p: 0, late: false, role: "hotel", fresh: false, _mf: {}, _amb: {} };

  // ------------------------------------------------------------ the six moments of the guest's journey
  var MOMENTS = [
    { k: "Landing", when: "Thursday, 16:10", img: "arrival-cars",
      guest: "A host is at the gate before she is. The sign reads ELLIE 12, never her name.",
      agency: "Host, fast track and porter, booked against the flight itself.",
      ellie: "Saw the flight land twenty minutes early. Told the host and the driver." },

      if (l) { l.style.left = (fx * 100) + "%"; l.style.top = ((pt.y - vb[1]) / vb[3] * 100) + "%"; l.style.opacity = op; l.style.setProperty("--ax", "-" + (8 + Math.max(0, Math.min(1, fx)) * 84).toFixed(1) + "%"); }
    };
    var m = o.main, mr = path(m.path), L = mr.L;
    var from = m.off || S._mf[m.id] === undefined || Math.abs(S._mf[m.id] - m.to) < .005 ? undefined : S._mf[m.id];
    if (m.off) delete S._mf[m.id];
    var jam = document.getElementById("rJam"), route = document.getElementById("rRoute");
    if (jam) { var J = path("rExp").L; jam.style.strokeDasharray = "0 " + (o.jam[0] * J) + " " + ((o.jam[1] - o.jam[0]) * J) + " " + J; }
    var t0 = performance.now(), last = t0;
    function frame(now) {
      if (!svg.isConnected) return;
      var dt = Math.min(.1, (now - last) / 1000); last = now;
      (o.amb || []).forEach(function (c) {
        var f = S._amb[c.id] === undefined ? c.f : S._amb[c.id];
        if (!reduce) { f += c.v * dt; if (f > 1) f -= 1; if (f < 0) f += 1; }
        S._amb[c.id] = f;
        put(c.id, at(path(c.path), f, c.flip), Math.max(0, Math.min(1, f / .04, (1 - f) / .04)), false);
      });
      var e = (now - t0) / 1000, f;
      if (reduce) f = m.to;
      else if (from !== undefined && e < 1.2) { var k = e / 1.2; k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; f = from + (m.to - from) * k; }
      else f = m.to + m.drift * Math.min(1, Math.max(0, e - (from !== undefined ? 1.2 : 0)) / 45);
      if (!m.off) S._mf[m.id] = f;
      put(m.id, at(mr, f, m.flip), 1, true);
      if (route) route.style.strokeDasharray = m.route === "ahead" ? "0 " + (f * L) + " " + ((1 - f) * L) + " " + L : m.route === "behind" ? (f * L) + " " + L : "0 " + L;
      if (!reduce) S._raf = requestAnimationFrame(frame);
    }
    frame(t0);
  }

  // ------------------------------------------------------------ navigation
  $("#prev").onclick = function () { go(S.i - 1); };
  $("#next").onclick = function () { go(S.i + 1); };
  $("#home").onclick = function () { S.m = 0; S.role = "hotel"; S.p = 0; S.late = false; S._mf = {}; go(0); };
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") go(S.i + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(S.i - 1);
    else if (e.key === "Home") $("#home").onclick();
    else if (e.key === "f" || e.key === "F") { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (x) {} }
  });
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
